const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/((b-a)||1e-6),0,1);
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const eIn=t=>Math.pow(clamp(t,0,1),3);
const eInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eBack=t=>{const c1=1.70158,c3=c1+1;t=clamp(t,0,1);return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rr(c,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function loadVideo(name,src){
  return new Promise((res)=>{
    const v=document.createElement('video');
    v.src=src;v.muted=true;v.preload='auto';v.playsInline=true;
    v.setAttribute('muted','');v.setAttribute('playsinline','');
    v.style.cssText='position:fixed;left:-20px;top:-20px;width:8px;height:8px;opacity:0.001;pointer-events:none;z-index:-1;';
    try{document.body.appendChild(v);}catch(e){}
    V[name]=v;
    let done=false;
    const fin=()=>{if(done)return;done=true;
      try{v.pause();}catch(e){}
      try{v.play().catch(function(){});}catch(e){}
      res(v);
    };
    v.addEventListener('loadeddata',fin,{once:true});
    v.addEventListener('canplay',fin,{once:true});
    v.addEventListener('error',fin,{once:true});
    try{v.load();}catch(e){fin();}
  });
}
async function videoAt(v,lt){
  if(!v)return;
  const d=v.duration;
  if(!d||!isFinite(d)||d<=0)return;
  lt=Math.max(0,Math.min(d-0.05,lt));
  if(Math.abs(v.currentTime-lt)<0.004&&v.readyState>=2)return;
  try{v.pause();}catch(e){}
  await new Promise(r=>{
    let fin=false;
    const done=()=>{if(fin)return;fin=true;r();};
    v.addEventListener('seeked',done,{once:true});
    setTimeout(done,350);
    try{v.currentTime=lt;}catch(e){done();}
  });
  if(v.requestVideoFrameCallback){
    await new Promise(r=>{
      let fin=false;
      const done=()=>{if(fin)return;fin=true;r();};
      try{v.requestVideoFrameCallback(done);}catch(e){done();}
      setTimeout(done,120);
    });
  }
}

let paperC,spaceC,scanC,gradeC,ggx,offA,offB,maskC,m2C,scanPat2=null;
function buildTextures(){
  paperC=mk(W,H);{
    const g=paperC.getContext('2d'),r=mulberry32(1234);
    g.fillStyle=PAPER;g.fillRect(0,0,W,H);
    for(let i=0;i<9000;i++){
      const x=r()*W,y=r()*H,w=2+r()*26,a=0.02+r()*0.05;

      const x=r()*W,y=r()*H,rad=40+r()*240;
      const gr=g.createRadialGradient(x,y,0,x,y,rad);
      gr.addColorStop(0,'rgba(150,130,100,'+(0.015+r()*0.03).toFixed(3)+')');
      gr.addColorStop(1,'rgba(150,130,100,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,7);g.fill();
    }

  spaceC=mk(W,H);{
    const g=spaceC.getContext('2d'),r=mulberry32(4242);

/* ---------- draw prims ---------- */
function T(c,s,x,y,size,fam,weight,color,align,ls){
  c.font=(weight||400)+' '+size+'px '+fam;
  c.fillStyle=color;c.textAlign=align||'left';c.textBaseline='alphabetic';
  if(ls){try{c.letterSpacing=ls+'px';}catch(e){}}
  c.fillText(s,x,y);
  if(ls){try{c.letterSpacing='0px';}catch(e){}}
}
function applyCam(c,cam,d){
  d=d===undefined?1:d;
  const z=1+(cam.z-1)*d;
  c.translate(W/2,H/2);c.rotate(cam.rot*d);c.scale(z,z);
  c.translate(-W/2-cam.x*d,-H/2-cam.y*d);
}
function drawCover(c,img,x,y,w,h,filter,zoom){
  if(!img||!img.naturalWidth)return;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const sc=Math.max(w/iw,h/ih)*(zoom||1);
  const sw=w/sc,sh=h/sc;
  c.save();if(filter)c.filter=filter;
  c.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);
  c.restore();
}
function plate(c,dw,dh,o){
  c.save();
  const g=c.createLinearGradient(0,0,dw*0.3,dh);
  g.addColorStop(0,'#12141a');g.addColorStop(0.5,'#0a0c11');g.addColorStop(1,'#040507');
  c.fillStyle=g;c.fillRect(0,0,dw,dh);
  if(scanPat2){c.globalAlpha=0.35;c.fillStyle=scanPat2;c.fillRect(0,0,dw,dh);c.globalAlpha=1;}
  if(o&&o.fb)drawCover(c,o.fb,0,0,dw,dh,'saturate(0.75) contrast(1.1) sepia(0.2) brightness(0.92)');
  const vg=c.createRadialGradient(dw/2,dh/2,dh*0.15,dw/2,dh/2,dh*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  c.fillStyle=vg;c.fillRect(0,0,dw,dh);
  c.restore();
}
function drawClip(c,v,dx,dy,dw,dh,o){
  o=o||{};
  if(!v||!v.videoWidth){
    c.save();c.translate(dx,dy);plate(c,dw,dh,o);c.restore();
    return;
  }
  ggx.setTransform(1,0,0,1,0,0);ggx.globalCompositeOperation='source-over';ggx.filter='none';
  ggx.clearRect(0,0,1280,720);
  ggx.save();ggx.filter=o.filter||GRADE;
  const vw=v.videoWidth,vh=v.videoHeight;
  const sc=Math.max(1280/vw,720/vh)*(o.zoom||1);
  const sw=vw*sc,sh=vh*sc;
  try{ggx.drawImage(v,(1280-sw)/2+(o.ox||0),(720-sh)/2+(o.oy||0),sw,sh);}catch(e){}
  ggx.restore();
  const dc=Math.max(dw/1280,dh/720);
  const cw=1280*dc,ch=720*dc;
  c.save();c.translate(dx,dy);c.drawImage(gradeC,(dw-cw)/2,(dh-ch)/2,cw,ch);c.restore();
}
function print(c,img,x,y,w,h,rot,opt){
  opt=opt||{};
  const b=opt.border==null?16:opt.border;
  c.save();c.translate(x+w/2,y+h/2);c.rotate(rot||0);
  c.save();
  c.shadowColor='rgba(25,18,10,0.45)';c.shadowBlur=opt.blur==null?34:opt.blur;
  c.shadowOffsetY=opt.offY==null?16:opt.offY;
  c.fillStyle='#fbf7ee';c.fillRect(-w/2-b,-h/2-b,w+2*b,h+2*b);
  c.restore();
  drawCover(c,img,-w/2,-h/2,w,h,opt.filter,opt.zoom);
  c.strokeStyle='rgba(0,0,0,0.10)';c.lineWidth=1;c.strokeRect(-w/2-0.5,-h/2-0.5,w+1,h+1);
  c.restore();
}
function tape(c,x,y,w,h,rot){
  c.save();c.translate(x,y);c.rotate(rot||0);
  c.fillStyle='rgba(226,212,178,0.62)';c.fillRect(-w/2,-h/2,w,h);
  c.fillStyle='rgba(255,255,255,0.20)';c.fillRect(-w/2,-h/2,w,h*0.34);
  c.strokeStyle='rgba(150,135,105,0.35)';c.lineWidth=1;c.strokeRect(-w/2,-h/2,w,h);

}
function highlighter(c,x,y,w,h,p,color){
  if(p<=0)return;
  c.save();c.fillStyle=color||'rgba(246,196,67,0.72)';
  const ww=w*clamp(p,0,1);
  c.beginPath();
  c.moveTo(x,y+h*0.55);c.lineTo(x+ww,y+h*0.44);
  c.lineTo(x+ww,y+h*1.02);c.lineTo(x,y+h*1.12);c.closePath();c.fill();
  c.restore();
}
function motes(c,t,count,alpha,dir){
  const r=mulberry32(909);
  c.save();c.filter='blur(3px)';
  for(let i=0;i<count;i++){
    const s1=r(),s2=r(),s3=r(),s4=r(),s5=r();
    const bx=s1*W*1.1-60, sp=0.35+s2*0.9, sz=2+s3*8;
    const span=H+260;
    let y=((s4*span)-(t*(26+38*sp)*(dir||1)))%span;
    if(y<0)y+=span;
    y-=130;
    const x=bx+Math.sin(t*0.55+i*1.7)*22;
    c.globalAlpha=alpha*(0.25+0.75*s5);
    c.fillStyle='rgba(246,236,214,1)';
    c.beginPath();c.arc(x,y,sz,0,7);c.fill();
  }
  c.restore();
}
function filmBands(c,t,alpha){
  c.save();

  c.fillRect(-220,H-34,W+440,220);

    rr(c,x,30,46,26,5);c.fill();

function softPlate(c,x,y,w,h,blur,color){
  c.save();

/* ---------- camera ---------- */
function camOf(i,t){
  const S=SCENES[i];const p=inv(S.t0,S.t1,t);
  let x=0,y=0,z=1.03,rot=0;
  if(i===0){z=lerp(1.06,1.01,eOut(inv(0,0.5,p)))+0.05*eIn(inv(0.85,1,p));x=lerp(-12,22,p);rot=lerp(0.006,0,eOut(inv(0,0.6,p)));}
  else if(i===1){z=lerp(1.05,1.0,eOut(p))+0.02*eIn(inv(0.8,1,p));x=lerp(24,-16,p);y=lerp(10,-10,p);rot=lerp(-0.004,0.003,p);}
  else if(i===2){z=lerp(1.0,1.05,eInOut(p));x=lerp(-12,14,p);rot=lerp(-0.006,0.004,p);}
  else if(i===3){z=lerp(1.0,1.035,eInOut(inv(0,0.45,p)))+0.03*eInOut(inv(0.55,1,p));x=lerp(10,-16,p);y=lerp(-8,8,p);rot=lerp(0.004,-0.003,p);}
  else if(i===4){z=lerp(1.08,1.0,eInOut(p));y=lerp(-22,18,p);x=lerp(-16,12,p);rot=lerp(-0.004,0.005,p);}
  else if(i===5){z=lerp(1.0,1.07,eInOut(p));x=lerp(14,-8,p);rot=lerp(0.003,-0.004,p);}
  else if(i===6){z=lerp(1.06,1.0,eOut(p));x=lerp(-10,14,p);y=lerp(14,-8,p);rot=lerp(-0.003,0.002,p);}
  else if(i===7){z=lerp(1.0,1.04,eInOut(p));x=lerp(-8,14,p);rot=lerp(0.003,-0.002,p);}
  else if(i===8){z=lerp(1.06,1.0,eOut(inv(0,0.4,p)));x=lerp(8,-10,p);rot=lerp(-0.004,0.003,p);}
  x+=Math.sin(t*0.71)*5+Math.sin(t*0.27+1.3)*3;
  y+=Math.cos(t*0.53)*4;
  rot+=Math.sin(t*0.37)*0.0016;
  return {x:x,y:y,z:z,rot:rot};
}

  T(c,'AUDIENCE · LIVE TELEVISION',-cw/2+34,-ch/2+52,28,"'IBM Plex Mono'",400,'#8d8168','left',2);
  const hp=smooth(inv(2.1,2.55,t));
  highlighter(c,-cw/2+28,ch/2-96,560,54,hp);
  const num=Math.round(600000000*eOut(inv(0.2,3.2,t)));
  T(c,num.toLocaleString('en-US'),-cw/2+34,ch/2-22,84,"'IBM Plex Mono'",600,VERM);
  c.restore();

    const segs=16;

    for(let i=0;i<=segs;i++){
      const y=-20+(H+40)*i/segs;

    }
    ctx.stroke();

/* ---------- subtitles & global ---------- */
function drawSubs(t){
  let idx=-1;
  for(let i=0;i<NARRATION.length;i++){if(t>=NARRATION[i].t-0.18)idx=i;}
  if(idx<0)return;
  const line=NARRATION[idx];
  const end=(idx<NARRATION.length-1)?NARRATION[idx+1].t-0.28:(window.END-0.3);
  if(t>end)return;
  let a=Math.min(1,(t-(line.t-0.18))/0.18,(end-t)/0.18);
  a=clamp(a,0,1);
  if(a<=0.01)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.font='400 38px Inter';
  const maxw=1400;
  const words=line.text.split(' ');
  const lines=[];let cur='';
  for(let i=0;i<words.length;i++){
    const test=cur?cur+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxw&&cur){lines.push(cur);cur=words[i];}
    else cur=test;
  }
  if(cur)lines.push(cur);
  const lh=50,padX=34,padY=22;
  let wMax=0;
  for(let i=0;i<lines.length;i++)wMax=Math.max(wMax,ctx.measureText(lines[i]).width);
  const bw=wMax+padX*2,bh=lines.length*lh+padY*2-8;
  const bx=960-bw/2,by=1012-bh;
  ctx.fillStyle='rgba(12,10,8,0.72)';rr(ctx,bx,by,bw,bh,14);ctx.fill();
  ctx.fillStyle='#f6f1e6';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],960,by+padY+lh*i+lh/2-4);
  ctx.restore();
}
function drawGlobal(t){
  ctx.save();
  const b=0.26+Math.sin(t*0.8)*0.03;
  const g=ctx.createRadialGradient(960,520,430,960,540,1290);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,8,6,'+b.toFixed(3)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.restore();

}

/* ---------- clip seeking ---------- */
async function seekClips(t){
  const jobs=[];
  for(let i=0;i<CLIPUSES.length;i++){
    const u=CLIPUSES[i];
    if(t>=u.t0-0.2&&t<=u.t1+0.2){
      const v=V[u.name];
      if(v){
        const lt=u.inp+Math.max(0,t-u.t0)*u.sp;
        jobs.push(videoAt(v,lt));
      }
    }
  }
  if(jobs.length)await Promise.all(jobs);
}

/* ---------- seek ---------- */
window.seek=async function(t){
  t=clamp(t,0,window.END-0.001);
  let i=0;
  for(let k=0;k<SCENES.length;k++){if(t>=SCENES[k].t0-1e-9)i=k;}
  await seekClips(t);
  let br=null;
  if(i<SCENES.length-1&&BRIDGES[i]&&t>=BRIDGES[i].start)br=BRIDGES[i];
  if(br){
    renderTo(offA,i,t);
    renderTo(offB,i+1,t);
    applyBridge(br,t);
  } else {
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
    drawScene(ctx,i,t);
  }
  drawGlobal(t);
};

/* ---------- AUDIO ---------- */
window.renderAudio=async function(){
  const SR=48000;
  const N=Math.ceil(window.END*SR);
  const ac=new OfflineAudioContext(2,N,SR);
  const rnd=mulberry32(20250720);
  const nb=ac.createBuffer(1,SR*2,SR);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;

  const master=ac.createGain();master.gain.value=1.0;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-8;comp.knee.value=8;comp.ratio.value=12;
  comp.attack.value=0.004;comp.release.value=0.3;
  const outG=ac.createGain();outG.gain.value=0.86;
  master.connect(comp);comp.connect(outG);outG.connect(ac.destination);

  const ir=ac.createBuffer(2,Math.floor(SR*2.4),SR);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<d.length;i++){const x=i/d.length;d[i]=(rnd()*2-1)*Math.pow(1-x,3.2);}
  }
  const conv=ac.createConvolver();conv.buffer=ir;
  const wet=ac.createGain();wet.gain.value=0.5;conv.connect(wet);wet.connect(master);

  const mus=ac.createGain();mus.gain.value=0.62;mus.connect(master);
  const musS=ac.createGain();musS.gain.value=0.55;mus.connect(musS);musS.connect(conv);
  const sfx=ac.createGain();sfx.gain.value=0.9;sfx.connect(master);
  const sfxS=ac.createGain();sfxS.gain.value=0.3;sfx.connect(sfxS);sfxS.connect(conv);
  const real=ac.createGain();real.gain.value=0.85;real.connect(master);

  const ivs=NARRATION.map(n=>[n.t-0.05,n.t+n.text.split(' ').length/2.55+0.38]);
  function duckAutom(param,base,mul){
    const pts=[[0,base]];
    ivs.forEach(function(iv){
      pts.push([Math.max(0,iv[0]-0.16),base]);
      pts.push([Math.max(0.02,iv[0]+0.05),base*mul]);
      pts.push([Math.max(0.04,iv[1]-0.05),base*mul]);
      pts.push([iv[1]+0.3,base]);
    });
    pts.sort(function(a,b){return a[0]-b[0];});
    let last=-1;
    for(let i=0;i<pts.length;i++){
      const T2=Math.max(pts[i][0],last+0.003);last=T2;
      if(i===0)param.setValueAtTime(pts[i][1],T2);

  duckAutom(sfx.gain,0.9,0.55);
  duckAutom(real.gain,0.85,0.5);

  function env(g,t0,atk,dec,peak){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+atk+dec);
  }
  function tone(o){
    const t0=o.t||0,f=o.f||220,dur=o.dur||0.5;
    const os=ac.createOscillator();os.type=o.type||'sine';
    os.frequency.setValueAtTime(f,t0);

    const g=ac.createGain();const p=ac.createStereoPanner();
    p.pan.value=o.pan||0;
    let node=os;
    if(o.lp){const b=ac.createBiquadFilter();b.type='lowpass';b.frequency.value=o.lp;node.connect(b);node=b;}
    if(o.hp){const b=ac.createBiquadFilter();b.type='highpass';b.frequency.value=o.hp;node.connect(b);node=b;}
    node.connect(g);g.connect(p);p.connect(o.dest||sfx);
    env(g,t0,o.atk==null?0.02:o.atk,o.dec==null?dur:o.dec,o.gain==null?0.2:o.gain);
    os.start(t0);os.stop(t0+dur+0.4);
  }
  function noise(o){
    const t0=o.t||0,dur=o.dur||0.4;
    const s=ac.createBufferSource();s.buffer=nb;s.loop=true;
    const bf=ac.createBiquadFilter();bf.type=o.type||'bandpass';
    bf.frequency.setValueAtTime(o.f||800,t0);
    if(o.f2)bf.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);

    const g=ac.createGain();const p=ac.createStereoPanner();p.pan.value=o.pan||0;

  async function loadBuf(src){
    try{
      const r=await fetch(src);
      const ab=await r.arrayBuffer();
      return await ac.decodeAudioData(ab);
    }catch(e){return null;}
  }
  async function placeReal(src,t0,rate,gain,ftype,f,q,stop){
    const b=await loadBuf(src);
    if(!b)return;
    const s=ac.createBufferSource();s.buffer=b;s.playbackRate.value=rate;
    const bf=ac.createBiquadFilter();bf.type=ftype;bf.frequency.value=f;bf.Q.value=q||0.7;
    const g=ac.createGain();g.gain.value=gain;
    s.connect(bf);bf.connect(g);g.connect(real);
    s.start(t0);
    const dur=Math.min(b.duration/rate,stop||b.duration/rate);
    s.stop(t0+dur);
  }

  function str(o,s){for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));}
  str(0,'RIFF');dv.setUint32(4,36+len*nCh*2,true);str(8,'WAVE');

  const chs=[];for(let c=0;c<nCh;c++)chs.push(buf.getChannelData(c));
  let off=44;
  for(let i=0;i<len;i++){
    for(let c=0;c<nCh;c++){
      let s=chs[c][i];
      s=s<-1?-1:(s>1?1:s);
      dv.setInt16(off,s<0?s*0x8000:s*0x7fff,true);
      off+=2;
    }
  }
  const bytes=new Uint8Array(ab);
  let bin='';
  const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  }
  return btoa(bin);
};
