<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
(function(){
"use strict";

/* ============================================================
   ONE BOX  —  a continuous-camera paper-collage explainer  (v3)
   picture + soundtrack, one take, no cuts
   ============================================================ */

const W = 1920, H = 1080, END = 58;
const SR = 48000;

const COL = {
  paper:'#f2ece0', ink:'#1b1b1b', yellow:'#f7c948',
  red:'#d64933', sea:'#2f6f8f', green:'#6b8f71', cream:'#fbf6ea'
};

/* ---------- SHARED TIMELINE (picture + sound read the same numbers) ---------- */
const TL = {
  scenes: [0, 5.5, 11.0, 16.5, 22.5, 28.5, 34.5, 41.0, 48.0, 54.0],
  trailers: {t0:16.5, lt0:2.3, step:0.16, drop:0.55, n:12, x0:-880, dx:160, w:140, h:62},
  wallIn: 51.30,
  wallRevealEnd: 53.90,
  lift: 56.20,
  reveal: 48.0
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', {alpha:false});

/* ---------------- utils ---------------- */
const clamp01 = v => v<0?0:v>1?1:v;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const easeIO = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* ---------------- assets ---------------- */
const IMG_PATHS = {
  mclean: 'assets/mclean_1957_cutout.png',
  ship:   'assets/container_ship_cutout.png',
  ideal:  'assets/ideal_x_1956_drawing.jpg',
  sealand:'assets/sealand_containers_bw.jpg',
  port:   'assets/port_aerial.jpg',
  cargo:  'assets/cargo_ship_aerial.jpg'
};
const IMG = {};
function im(k){
  const i = IMG[k];
  return (i && i.complete && i.naturalWidth) ? i : null;
}

/* ---------------- paper grain (drawn once) ---------------- */
const GRAIN = (function(){
  const gw = 960, gh = 540;
  const cv = document.createElement('canvas');
  cv.width = gw; cv.height = gh;
  const g = cv.getContext('2d');
  const img = g.createImageData(gw, gh);
  const d = img.data;
  const rnd = mulberry32(20240117);
  for(let i=0;i<gw*gh;i++){
    const v = rnd();
    let c, a;
    if(v < 0.5){ c = 20; a = 26; } else { c = 255; a = 30; }
    const o = i*4;
    d[o]=c; d[o+1]=c; d[o+2]=c; d[o+3]=a;
  }
  g.putImageData(img,0,0);
  g.globalAlpha = 0.10;
  g.strokeStyle = '#4a3f2c';
  g.lineWidth = 1;
  const r2 = mulberry32(99);
  for(let i=0;i<420;i++){
    const x = r2()*gw, y = r2()*gh, a = r2()*Math.PI*2, len = 6+r2()*34;
    g.beginPath();
    g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*len*0.5+ (r2()-0.5)*10, y+Math.sin(a)*len*0.5+(r2()-0.5)*10, x+Math.cos(a)*len, y+Math.sin(a)*len);
    g.stroke();
  }
  return cv;
})();

/* ---------------- text ---------------- */
function T(s,x,y,size,o){
  o = o||{};
  ctx.save();
  const fam = o.family || 'Inter';
  ctx.font = (o.weight||600)+' '+size+'px "'+fam+'", sans-serif';
  ctx.fillStyle = o.color || COL.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.baseline || 'alphabetic';
  if(o.spacing) ctx.letterSpacing = o.spacing;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function M(s,size,weight,family){
  ctx.save();
  ctx.font = (weight||600)+' '+size+'px "'+(family||'Inter')+'", sans-serif';
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

/* ---------------- paper helpers ---------------- */
function setShadow(lift){
  ctx.shadowColor = 'rgba(27,27,27,'+(0.13+0.17*lift).toFixed(3)+')';
  ctx.shadowBlur = 8 + 14*lift;
  ctx.shadowOffsetX = 1 + 3*lift;
  ctx.shadowOffsetY = 3 + 6*lift;
}
function clearShadow(){
  ctx.shadowColor='rgba(0,0,0,0)'; ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
}

function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function tornRect(x,y,w,h,seed,amp){
  amp = amp===undefined?4:amp;
  const r = mulberry32(seed);
  const nx = Math.max(5, Math.round(w/58));
  const ny = Math.max(5, Math.round(h/58));
  ctx.beginPath();
  for(let i=0;i<=nx;i++){ const px=x+w*i/nx, py=y+(r()-0.5)*2*amp; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  for(let i=1;i<=ny;i++){ const px=x+w+(r()-0.5)*2*amp, py=y+h*i/ny; ctx.lineTo(px,py); }
  for(let i=1;i<=nx;i++){ const px=x+w-w*i/nx, py=y+h+(r()-0.5)*2*amp; ctx.lineTo(px,py); }
  for(let i=1;i<=ny;i++){ const px=x+(r()-0.5)*2*amp, py=y+h-h*i/ny; ctx.lineTo(px,py); }
  ctx.closePath();
}

function tape(x,y,w,h,rot){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.fillStyle='rgba(247,201,72,0.55)';
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillRect(-w/2,-h/2,w,h*0.34);
  ctx.fillStyle='rgba(27,27,27,0.05)';
  ctx.fillRect(-w/2,h*0.3,w,h*0.2);
  ctx.restore();
}

function highlight(x,y,w,h,p,seed){
  if(p<=0) return;
  const ww = w*p;
  const r = mulberry32(seed||7);
  ctx.save();
  ctx.fillStyle='rgba(247,201,72,0.86)';
  ctx.beginPath();
  const n = Math.max(5, Math.round(ww/38));
  ctx.moveTo(x, y+(r()-0.5)*7);
  for(let i=1;i<=n;i++) ctx.lineTo(x+ww*i/n, y+(r()-0.5)*9);
  for(let i=n;i>=0;i--) ctx.lineTo(x+ww*i/n, y+h+(r()-0.5)*9);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function hlText(str,x,y,size,weight,family,p){
  const w = M(str,size,weight,family);
  highlight(x-7, y-size*0.72, w+14, size*0.60, p, (str.length*97+size*13)|0);
  return w;
}

function handCircle(cx,cy,rx,ry,p,rot,color,lw){
  if(p<=0) return;
  const N = 72;
  ctx.save();
  ctx.strokeStyle = color||COL.ink;
  ctx.lineWidth = lw||4;
  ctx.lineCap='round';
  ctx.beginPath();
  const upto = Math.floor(N*p);
  for(let i=0;i<=upto;i++){
    const a = (i/N)*Math.PI*2 + (rot||0);
    const wob = 1 + 0.035*Math.sin(i*1.9) + 0.02*Math.cos(i*0.7);
    const px = cx + Math.cos(a)*rx*wob;
    const py = cy + Math.sin(a)*ry*wob;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.stroke();
  ctx.restore();
}

function handArrow(x1,y1,x2,y2,p,color,lw){
  if(p<=0) return;
  const mx = (x1+x2)/2 + (y2-y1)*0.16;
  const my = (y1+y2)/2 - (x2-x1)*0.16;
  const steps = 34;
  const upto = Math.max(1,Math.floor(steps*p));
  ctx.save();
  ctx.strokeStyle = color||COL.ink;
  ctx.lineWidth = lw||4;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  let lx=x1, ly=y1;
  for(let i=0;i<=upto;i++){
    const s=i/steps, is=1-s;
    const px = is*is*x1 + 2*is*s*mx + s*s*x2;
    const py = is*is*y1 + 2*is*s*my + s*s*y2;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    lx=px; ly=py;
  }
  ctx.stroke();
  if(p>0.85){
    const ang = Math.atan2(y2-ly, x2-lx) || Math.atan2(y2-my, x2-mx);
    const hl = (lw||4)*4.5;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - Math.cos(ang-0.42)*hl, y2 - Math.sin(ang-0.42)*hl);
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - Math.cos(ang+0.42)*hl, y2 - Math.sin(ang+0.42)*hl);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- printed photograph ---------------- */
function drawPhoto(key, cx, cy, w, h, rot, opt){
  opt = opt||{};
  const image = im(key);
  const bw = opt.bw||18;
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot||0);

  setShadow(opt.lift===undefined?0.55:opt.lift);
  ctx.fillStyle = '#fdfaf3';
  ctx.fillRect(-w/2-bw, -h/2-bw, w+bw*2, h+bw*2);
  clearShadow();

  if(image) ctx.drawImage(image, -w/2, -h/2, w, h);
  else {
    ctx.fillStyle='#b9b2a4'; ctx.fillRect(-w/2,-h/2,w,h);
    T('PHOTO', 0, 0, 30, {align:'center', color:'rgba(27,27,27,0.35)'});
  }
  ctx.strokeStyle='rgba(27,27,27,0.16)'; ctx.lineWidth=1.5;
  ctx.strokeRect(-w/2,-h/2,w,h);
  if(opt.dim){
    ctx.fillStyle='rgba(14,18,20,'+opt.dim+')';
    ctx.fillRect(-w/2,-h/2,w,h);
  }
  if(opt.credit!==false){
    T('Photo: Wikimedia Commons', 0, h/2+bw+17, 15, {weight:500, color:'rgba(27,27,27,0.40)', align:'center'});
  }
  ctx.restore();

  const co = [[-w/2-bw+22,-h/2-bw+18,-0.32],[w/2+bw-22,h/2+bw-18,0.28]];
  for(let i=0;i<2;i++){
    const p = co[i];
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(rot||0);
    tape(p[0], p[1], 130, 40, p[2]);
    ctx.restore();
  }
}

/* ---------------- container / crate art ---------------- */
function containerSide(x,y,w,h,col,doorRight){
  ctx.fillStyle = col;
  rr(x,y,w,h,3);
  ctx.fill();
  clearShadow();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(x+2,y+2,w-4,Math.max(2,h*0.10));
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.fillRect(x+2,y+h-Math.max(2,h*0.11),w-4,Math.max(2,h*0.11));
  ctx.strokeStyle='rgba(0,0,0,0.14)';
  ctx.lineWidth=Math.max(1.4,w*0.007);
  const n = Math.max(5, Math.round(w/24));
  ctx.beginPath();
  for(let i=1;i<n;i++){
    const rx = x+6+(w-12)*i/n;
    ctx.moveTo(rx,y+h*0.14); ctx.lineTo(rx,y+h*0.86);
  }
  ctx.stroke();
  const cw = Math.min(w*0.05,15), ch = Math.min(h*0.24,17);
  ctx.fillStyle='rgba(27,27,27,0.82)';
  ctx.fillRect(x+1,y+1,cw,ch);
  ctx.fillRect(x+w-cw-1,y+1,cw,ch);
  ctx.fillRect(x+1,y+h-ch-1,cw,ch);
  ctx.fillRect(x+w-cw-1,y+h-ch-1,cw,ch);
  const dx = x+w-8;
  ctx.strokeStyle='rgba(0,0,0,0.26)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(dx,y+h*0.13); ctx.lineTo(dx,y+h*0.87); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dx-5,y+h*0.24); ctx.lineTo(dx-5,y+h*0.76); ctx.stroke();
}

function crate(x,y,w,h,col,seed){
  ctx.fillStyle=col;
  ctx.fillRect(x,y,w,h);
  clearShadow();
  ctx.strokeStyle='rgba(27,27,27,0.42)';
  ctx.lineWidth=2;
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.beginPath();
  ctx.moveTo(x+2,y+2); ctx.lineTo(x+w-2,y+h-2);
  ctx.moveTo(x+w-2,y+2); ctx.lineTo(x+2,y+h-2);
  ctx.stroke();
}

function person(x,y,s,col){
  ctx.save();
  ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = col||COL.ink;
  ctx.beginPath(); ctx.arc(0,-30,9.5,0,Math.PI*2); ctx.fill();
  rr(-10,-19,20,28,6); ctx.fill();
  ctx.fillRect(-8,8,6,18);
  ctx.fillRect(2,8,6,18);
  ctx.fillRect(-14,-16,5,18);
  ctx.fillRect(9,-16,5,18);
  ctx.restore();
}

/* ---------------- camera ---------------- */
const CX = [0, 1800, 3600, 5400, 7200, 9000, 10800, 12600, 14400];

const CAMS = [
  [0.00,  -300, -80, 1.55],
  [2.60,     0,   0, 1.02],
  [4.60,    14,  -4, 1.05],
  [5.15,   700,  -8, 0.92],
  [5.85,  1800,   0, 1.02],
  [10.65, 1830,  -6, 1.05],
  [11.15, 2760,  -8, 0.92],
  [11.85, 3600,   0, 1.02],
  [16.15, 3620,  -6, 1.05],
  [16.60, 4520,  -8, 0.94],
  [17.35, 5150,   0, 1.00],
  [19.60, 5400,  -6, 1.02],
  [22.15, 5400,  -6, 1.02],
  [22.65, 6380,  -8, 0.92],
  [23.35, 7200,   0, 1.00],
  [28.15, 7220,  -6, 1.04],
  [28.65, 8180,  -8, 0.92],
  [29.35, 9000,   0, 1.02],
  [34.05, 9020,  -6, 1.04],
  [34.45, 9800,  -8, 0.94],
  [35.05,10800,   0, 1.02],
  [40.65,10820,  -6, 1.05],
  [41.15,11750,  -8, 0.92],
  [41.85,12600,   0, 1.00],
  [47.65,12620,  -6, 1.04],
  [48.15,13500,  -8, 0.92],
  [48.85,14400,   0, 1.00],
  [51.20,14420,  -6, 1.03],
  [53.80,14820, -30, 2.85],
  [56.00,14820, -30, 1.40],
  [57.00,14860,   0, 1.44],
  [58.00,14944,  20, 2.30]
];

function camAt(t){
  const K = CAMS;
  let i = 0;
  while(i < K.length-2 && t > K[i+1][0]) i++;
  const a = K[i], b = K[i+1];
  let u = clamp01((t-a[0])/(b[0]-a[0]));
  u = easeIO(u);
  const x = lerp(a[1],b[1],u);
  const y = lerp(a[2],b[2],u);
  const z = lerp(a[3],b[3],u);
  return {
    x: x + Math.sin(t*0.71)*5.5,
    y: y + Math.sin(t*0.53+1.2)*6.5,
    z: z * (1 + Math.sin(t*0.87)*0.005),
    rot: Math.sin(t*0.31)*0.0034
  };
}

function applyLayer(k, cam){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(W/2, H/2);
  ctx.rotate(cam.rot*k);
  const s = 1 + (cam.z-1)*k;
  ctx.scale(s,s);
  ctx.translate(-cam.x*k, -cam.y*k);
}

function layerRange(cam,k,pad){
  const s = 1 + (cam.z-1)*k;
  const hw = (W/2+ (pad||0))/s;
  const hh = (H/2+ (pad||0))/s;
  const cx = cam.x*k, cy = cam.y*k;
  return {x0:cx-hw, x1:cx+hw, y0:cy-hh, y1:cy+hh, s:s};
}

/* ============================================================
   WALL OF CONTAINERS
   ============================================================ */
const WALL_CX = 14800, WALL_CY = -30, WALL_S = 0.5;

const WALL = (function(){
  const r = mulberry32(20240607);
  const cols=44, rows=40, cw=90, ch=44, gx=6, gy=6;
  const ox = -(cols*(cw+gx))/2, oy = -(rows*(ch+gy))/2;
  const pal = [COL.red, COL.sea, COL.green, '#c9903f', '#b6ac97'];
  const groups = {};
  const all = [];
  let maxD = 1;
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const v = r();
      let c = pal[0];
      if(v<0.30) c = pal[0];
      else if(v<0.56) c = pal[1];
      else if(v<0.80) c = pal[2];
      else if(v<0.92) c = pal[3];
      else c = pal[4];
      const x = ox+i*(cw+gx), y = oy+j*(ch+gy);
      const d = Math.hypot(x*0.75, y*1.25) * (0.82 + r()*0.36);
      if(d>maxD) maxD = d;
      const it = {x:x, y:y, w:cw, h:ch, c:c, d:d};
      all.push(it);
      if(!groups[c]) groups[c] = [];
      groups[c].push(it);
    }
  }
  for(const c in groups) groups[c].sort((a,b)=>a.d-b.d);
  let hero = all[0], bd = 1e9;
  for(let i=0;i<all.length;i++){
    const it = all[i];
    const dd = Math.hypot(it.x-288, it.y-100);
    if(dd<bd){ bd=dd; hero=it; }
  }
  return {
    cols:cols, rows:rows, cw:cw, ch:ch, gx:gx, gy:gy, ox:ox, oy:oy,
    w:cols*(cw+gx), h:rows*(ch+gy), groups:groups, all:all, maxD:maxD, hero:hero
  };
})();

function drawWall(t, reveal, alpha){
  const S = WALL_S;
  ctx.save();
  ctx.translate(WALL_CX, WALL_CY);
  ctx.scale(S,S);

  const baseA = Math.min(1, reveal*3) * alpha;
  if(baseA>0){
    ctx.save();
    ctx.globalAlpha = baseA;
    ctx.fillStyle = '#222a2e';
    ctx.fillRect(-WALL.w/2-70, -WALL.h/2-70, WALL.w+140, WALL.h+140);
    ctx.restore();
  }

  ctx.globalAlpha = alpha;
  const thresh = reveal * WALL.maxD * 1.03;
  let c, arr, i, it;

  for(c in WALL.groups){
    arr = WALL.groups[c];
    ctx.fillStyle = c;
    for(i=0;i<arr.length;i++){
      it = arr[i];
      if(it.d > thresh) break;
      ctx.fillRect(it.x, it.y, it.w, it.h);
    }
  }
  ctx.beginPath();
  for(c in WALL.groups){
    arr = WALL.groups[c];
    for(i=0;i<arr.length;i++){
      it = arr[i];
      if(it.d > thresh) break;
      ctx.rect(it.x, it.y, it.w, 7);
    }
  }
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fill();

  ctx.beginPath();
  for(c in WALL.groups){
    arr = WALL.groups[c];
    for(i=0;i<arr.length;i++){
      it = arr[i];
      if(it.d > thresh) break;
      ctx.moveTo(it.x+it.w*0.34, it.y+8); ctx.lineTo(it.x+it.w*0.34, it.y+it.h-6);
      ctx.moveTo(it.x+it.w*0.68, it.y+8); ctx.lineTo(it.x+it.w*0.68, it.y+it.h-6);
    }
  }
  ctx.strokeStyle='rgba(0,0,0,0.11)';
  ctx.lineWidth=2.6;
  ctx.stroke();

  const h = WALL.hero;
  const lift = clamp01((t-TL.lift)/1.2);
  if(t > 53.1){
    ctx.save();
    ctx.shadowColor = 'rgba(15,14,12,'+(0.28+0.34*lift).toFixed(3)+')';
    ctx.shadowBlur = 22 + 46*lift;
    ctx.shadowOffsetX = 5 + 12*lift;
    ctx.shadowOffsetY = 9 + 22*lift;
    ctx.fillStyle = COL.yellow;
    rr(h.x-9-lift*10, h.y-9-lift*10, h.w+18+lift*20, h.h+18+lift*20, 4);
    ctx.fill();
    clearShadow();
    ctx.restore();
    containerSide(h.x, h.y, h.w, h.h, COL.red, true);
  }

  if(t > 54.6){
    const p = clamp01((t-54.6)/0.7);

function blob(pts,cx,cy,w,h,color,seed){
  const r = mulberry32(seed);
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const jx = (r()-0.5)*7, jy = (r()-0.5)*7;
    const px = cx+pts[i][0]*w + jx;
    const py = cy+pts[i][1]*h + jy;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}

    const N = 40, upto = Math.floor(N*rp);
    let lx=0, ly=0;

const SCENE_FNS = [scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8];
const SCENE_EXT = [1000, 1600, 1000, 1650, 1100, 1250, 1250, 1300, 1800];

function drawMain(t,cam){
  const R = layerRange(cam,1,900);
  for(let i=0;i<SCENE_FNS.length;i++){
    const cx = CX[i], ext = SCENE_EXT[i];
    if(cx+ext < R.x0 || cx-ext > R.x1) continue;
    ctx.save();
    ctx.translate(cx,0);
    SCENE_FNS[i](t, t-TL.scenes[i]);
    ctx.restore();
  }
}

/* ---------------- far paper world ---------------- */
function drawFar(cam){
  const R = layerRange(cam,0.28,900);
  const cell = 760;
  const i0 = Math.floor(R.x0/cell)-1, i1 = Math.ceil(R.x1/cell)+1;
  const j0 = Math.floor(R.y0/cell)-1, j1 = Math.ceil(R.y1/cell)+1;
  for(let i=i0;i<=i1;i++){
    for(let j=j0;j<=j1;j++){
      const r = mulberry32(i*7919 + j*104729 + 13);
      const x = i*cell + r()*220;
      const y = j*cell + r()*220;
      const s = 380 + r()*360;
      const rot = (r()-0.5)*0.5;
      const warm = r();
      ctx.save();
      ctx.translate(x,y); ctx.rotate(rot);
      ctx.fillStyle = warm>0.5 ? 'rgba(251,246,234,0.66)' : 'rgba(47,111,143,0.05)';
      ctx.fillRect(-s/2,-s/2,s,s);
      ctx.restore();
    }
  }
}

/* ---------------- mid layer ---------------- */
function drawMid(t,cam){
  const R = layerRange(cam,0.62,900);
  const ghosts = [
    [ 900,'1956'],[2700,'PORTS'],[4500,'IDEA'],[6300,'STANDARD'],
    [8100,'1965'],[9900,'20 / 40'],[11700,'−98%'],[13500,'90%']
  ];
  for(let i=0;i<ghosts.length;i++){
    const g = ghosts[i];
    if(g[0]+1300 < R.x0 || g[0]-1300 > R.x1) continue;
    ctx.save();
    ctx.globalAlpha = 0.05;
    T(g[1], g[0], 210, 500, {weight:700, family:'Oswald', color:COL.ink, align:'center'});
    ctx.restore();
  }
  ctx.strokeStyle='rgba(27,27,27,0.05)';
  ctx.lineWidth=2;
  const y0 = Math.floor(R.y0/120)*120;
  for(let y=y0;y<R.y1;y+=120){
    ctx.beginPath(); ctx.moveTo(R.x0,y); ctx.lineTo(R.x1,y); ctx.stroke();
  }
  // travelling measuring tape across the whole world (keeps the frame busy between scenes)
  const ty = 470;
  if(R.y1 > ty-60 && R.y0 < ty+70){
    ctx.save();
    ctx.globalAlpha = 0.85;
    setShadow(0.35);
    ctx.fillStyle = '#efe6d4';
    ctx.fillRect(R.x0, ty, R.x1-R.x0, 46);
    clearShadow();
    ctx.strokeStyle='rgba(27,27,27,0.22)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(R.x0,ty); ctx.lineTo(R.x1,ty); ctx.moveTo(R.x0,ty+46); ctx.lineTo(R.x1,ty+46); ctx.stroke();
    const step=40, s0=Math.floor(R.x0/step)*step;
    ctx.beginPath();
    for(let x=s0;x<R.x1;x+=step){
      const big = (Math.round(x/step)%5===0);
      ctx.moveTo(x,ty); ctx.lineTo(x,ty+(big?16:9));
      ctx.moveTo(x,ty+46); ctx.lineTo(x,ty+46-(big?16:9));
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------------- near layer : drifting scraps ---------------- */
function drawNear(t,cam){
  const R = layerRange(cam,1.5,900);
  const cell = 1700;
  const i0 = Math.floor(R.x0/cell), i1 = Math.ceil(R.x1/cell);
  const j0 = Math.floor(R.y0/cell), j1 = Math.ceil(R.y1/cell);
  for(let i=i0;i<=i1;i++){
    for(let j=j0;j<=j1;j++){
      const r = mulberry32(i*31337 + j*911 + 7);
      for(let k=0;k<2;k++){
        const x = i*cell + r()*cell;
        const y = j*cell + r()*cell;
        const s = 48 + r()*66;
        const a = r()*Math.PI;
        const yellow = r()>0.66;
        const dx = Math.sin(t*0.5 + k*1.7 + i)*16;
        const dy = Math.cos(t*0.42 + j*1.3)*12;
        ctx.save();
        ctx.translate(x+dx, y+dy);
        ctx.rotate(a);
        setShadow(0.9);
        ctx.fillStyle = yellow ? 'rgba(247,201,72,0.45)' : 'rgba(251,246,234,0.85)';
        tornRect(-s/2,-s*0.34,s,s*0.68, i*17+j*31+k+5, 3);
        ctx.fill();
        clearShadow();
        ctx.restore();
      }
    }
  }
}

/* ---------------- foreground cut-out (screen space) ---------------- */
function drawForeground(t){
  const t0 = 47.30, t1 = 51.10;
  const aIn  = clamp01((t-t0)/0.45);
  const aOut = clamp01((t1-t)/0.45);
  const a = Math.min(aIn, aOut);
  if(a<=0) return;
  const p = clamp01((t-t0)/(t1-t0));
  const x = lerp(2200, -2000, p);
  const y = 900 + Math.sin(t*0.55)*20;
  const sc = 1 + 0.10*p;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.shadowColor='rgba(16,14,12,0.55)';
  ctx.shadowBlur=52;
  ctx.shadowOffsetX=-24;
  ctx.shadowOffsetY=30;
  if(im('ship')) ctx.drawImage(im('ship'), -1050, -588, 2100, 1176);
  clearShadow();
  ctx.restore();
}

/* ---------------- grain / vignette ---------------- */
function drawGrain(){
  ctx.save();
  ctx.globalAlpha = 0.62;
  ctx.drawImage(GRAIN, 0, 0, W, H);
  ctx.restore();
}
function drawVignette(t){
  const a = 0.10 + 0.020*Math.sin(t*2.3) + 0.012*Math.sin(t*5.7+1.1);
  const g = ctx.createRadialGradient(W/2,H/2,H*0.32, W/2,H/2,H*1.02);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(30,22,10,'+a.toFixed(3)+')');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

/* ---------------- narration + subtitles ---------------- */
const NARR = [
  {t: 0.20, text:"Every shipping container on Earth is basically the same box"},
  {t: 5.70, text:"Before 1956, ships were loaded by hand, sack by sack"},
  {t:11.20, text:"A ship could sit in port for a week, and cargo simply vanished"},
  {t:16.75, text:"Then a trucker named Malcolm McLean had an idea, load the whole trailer"},
  {t:22.70, text:"It worked. But soon every company built its own box, in its own size"},
  {t:28.80, text:"Nothing fit anything, so in the 1960s the world agreed on one standard"},
  {t:34.80, text:"Twenty feet long. Forty feet long. The same corners, the same locks, everywhere"},
  {t:41.20, text:"Loading time fell from days to hours, and the cost of shipping collapsed"},
  {t:48.20, text:"Today about ninety percent of everything you own travelled inside one of these"},
  {t:54.30, text:"One boring box that quietly built the modern world"}
];
window.NARRATION = NARR;

const SUBS = NARR.map(function(n,i){
  return {
    t0: i===0 ? 0 : Math.max(0, n.t-0.22),
    t1: (i<NARR.length-1) ? NARR[i+1].t-0.32 : END,
    text: n.text
  };
});

function drawSubs(t){
  for(let i=0;i<SUBS.length;i++){
    const s = SUBS[i];
    if(t < s.t0-0.05 || t > s.t1+0.05) continue;
    let a = 1;
    if(t < s.t0+0.25) a = (t-s.t0)/0.25;
    if(t > s.t1-0.25) a = Math.min(a,(s.t1-t)/0.25);
    a = clamp01(a);
    if(a<=0) continue;

    const FS = 40, MAXW = 1360;
    ctx.save();
    ctx.font = '500 '+FS+'px "Inter", sans-serif';
    const words = s.text.split(' ');
    const lines = [];
    let cur = '';
    for(let w=0;w<words.length;w++){
      const test = cur ? cur+' '+words[w] : words[w];
      if(ctx.measureText(test).width > MAXW && cur){
        lines.push(cur); cur = words[w];
      } else cur = test;
    }
    if(cur) lines.push(cur);
    ctx.restore();

    let maxw = 0;
    ctx.save();
    ctx.font = '500 '+FS+'px "Inter", sans-serif';
    for(let l=0;l<lines.length;l++) maxw = Math.max(maxw, ctx.measureText(lines[l]).width);
    ctx.restore();

    const padX = 44, padY = 26, lh = 54;
    const bw = Math.min(MAXW+padX*2, maxw + padX*2);
    const bh = lines.length*lh + padY*2 - 12;
    const bx = W/2, byTop = 1012 - bh;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle='rgba(20,18,16,0.72)';
    rr(bx-bw/2, byTop, bw, bh, 20);
    ctx.fill();

    if(i===NARR.length-1){
      const hp = clamp01((t-55.05)/0.55);
      if(hp>0){
        for(let l=0;l<lines.length;l++){
          const idx = lines[l].indexOf('modern world');
          if(idx>=0){
            const fullw = M(lines[l], FS, 500, 'Inter');
            const prew  = M(lines[l].substring(0,idx), FS, 500, 'Inter');
            const wword = M('modern world', FS, 500, 'Inter');
            const x0 = bx - fullw/2 + prew - 6;
            const yy = byTop + padY + lh*l + lh/2 - 6 + 20;
            highlight(x0, yy-24, wword+12, 30, hp, 149);
          }
        }
      }
    }

    ctx.fillStyle='#ffffff';
    ctx.font='500 '+FS+'px "Inter", sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    for(let l=0;l<lines.length;l++){
      ctx.fillText(lines[l], bx, byTop + padY + lh*l + lh/2 - 6);
    }
    ctx.restore();
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(t){
  t = clamp(t, 0, END);
  const cam = camAt(t);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = COL.paper;
  ctx.fillRect(0,0,W,H);

  applyLayer(0.28, cam);
  drawFar(cam);

  applyLayer(0.62, cam);
  drawMid(t, cam);

  const cPrev = camAt(Math.max(0, t-0.05));
  const spd = Math.abs(cam.x - cPrev.x) * cam.z / 0.05;
  if(spd > 900){
    const gA = Math.min(0.20, (spd-900)/7000 + 0.07);
    ctx.globalAlpha = gA;
    const tg = Math.max(0, t-0.035);
    const cg = camAt(tg);
    applyLayer(1, cg);
    drawMain(tg, cg);
    ctx.globalAlpha = 1;
  }

  applyLayer(1, cam);
  drawMain(t, cam);

  applyLayer(1.5, cam);
  drawNear(t, cam);

  ctx.setTransform(1,0,0,1,0,0);
  drawForeground(t);

  drawGrain();
  drawVignette(t);
  drawSubs(t);
}

/* ============================================================
   AUDIO ENGINE  —  everything synthesized in code
   ============================================================ */
function mkNoise(ac, dur, seed){
  const n = Math.round(dur*SR);
  const b = ac.createBuffer(1, n, SR);
  const d = b.getChannelData(0);
  const r = mulberry32(seed);
  for(let i=0;i<n;i++) d[i] = r()*2-1;
  return b;
}

async function renderAudioImpl(){
  const ac = new OfflineAudioContext(2, Math.round(SR*END), SR);
  const rnd = mulberry32(97531);
  const NOISE = mkNoise(ac, 4, 555);

  /* ---------- master ---------- */
  const limiter = ac.createWaveShaper();
  const curve = new Float32Array(2048);
  for(let i=0;i<2048;i++){
    const x = i/1023.5 - 1;
    curve[i] = Math.tanh(x*1.8)/Math.tanh(1.8);
  }
  limiter.curve = curve;
  limiter.oversample = '2x';

  const master = ac.createGain();
  master.gain.value = 0.90;
  master.connect(limiter);
  limiter.connect(ac.destination);

  /* ---------- reverb ---------- */
  const irLen = Math.round(SR*3.0);
  const ir = ac.createBuffer(2, irLen, SR);
  for(let c=0;c<2;c++){
    const d = ir.getChannelData(c);
    for(let i=0;i<irLen;i++){
      const x = i/irLen;
      const pre = i < SR*0.012 ? (i/(SR*0.012)) : 1;
      d[i] = (rnd()*2-1) * Math.pow(1-x, 2.6) * pre;
    }
  }

  const revRet = ac.createGain(); revRet.gain.value = 0.58;
  conv.connect(revRet); revRet.connect(master);

  const musicGain = ac.createGain(); musicGain.gain.value = 0.62;
  const musicDuck = ac.createGain(); musicDuck.gain.value = 1;

  const musicRev = ac.createGain(); musicRev.gain.value = 0.42;
  musicDuck.connect(musicRev); musicRev.connect(conv);

  const sfxGain = ac.createGain(); sfxGain.gain.value = 1.0;
  const sfxDuck = ac.createGain(); sfxDuck.gain.value = 1;

  });

  [-10, -6].forEach(function(db, idx){
    const node = idx===0 ? musicDuck : sfxDuck;
    const base = 1;
    const target = Math.pow(10, db/20);
    node.gain.setValueAtTime(base, 0);
    spans.forEach(function(sp){
      const s = Math.max(0, sp[0]);
      const e = Math.min(END, sp[1]);
      node.gain.setValueAtTime(base, Math.max(0, s-0.15));
      node.gain.linearRampToValueAtTime(base*target, s);
      node.gain.setValueAtTime(base*target, e);
      node.gain.linearRampToValueAtTime(base, Math.min(END, e+0.40));
    });
  });

  /* ---------- render & encode ---------- */
  const buf = await ac.startRendering();
  return encodeWAV(buf);
}

function encodeWAV(buf){
  const nCh = buf.numberOfChannels;
  const len = buf.length;
  const bytes = 44 + len*nCh*2;
  const ab = new ArrayBuffer(bytes);
  const dv = new DataView(ab);
  function ws(o,s){ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); }
  ws(0,'RIFF'); dv.setUint32(4, bytes-8, true); ws(8,'WAVE');
  ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,nCh,true); dv.setUint32(24,SR,true);
  dv.setUint32(28,SR*nCh*2,true); dv.setUint16(32,nCh*2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40, len*nCh*2, true);

  const chans = [];
  for(let c=0;c<nCh;c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for(let i=0;i<len;i++){
    for(let c=0;c<nCh;c++){
      let s = chans[c][i];
      s = s<-1?-1:(s>1?1:s);
      dv.setInt16(o, s<0 ? s*32768 : s*32767, true);
      o += 2;
    }
  }
  const bytesArr = new Uint8Array(ab);
  let str = '';
  const CH = 0x8000;
  for(let i=0;i<bytesArr.length;i+=CH){
    str += String.fromCharCode.apply(null, bytesArr.subarray(i, i+CH));
  }
  return btoa(str);
}

window.renderAudio = function(){
  return renderAudioImpl();
};

/* ============================================================
   BOOT / API
   ============================================================ */
window.END = END;
window.READY = false;

let paused = false;
let clockStart = null;

function loop(ts){
  if(clockStart === null) clockStart = ts;
  if(!paused){
    const t = (ts - clockStart)/1000;
    render(t > END ? END : t);
  }
  requestAnimationFrame(loop);
}

window.seek = async function(t){
  paused = true;
  render(t);
  return true;
};

window.play = function(){
  paused = false;
  clockStart = performance.now();
};

let imagesDone = false, fontsDone = false, booted = false;

function tryBoot(){
  if(booted) return;
  if(!imagesDone || !fontsDone) return;
  booted = true;
  render(0);
  window.READY = true;
  requestAnimationFrame(loop);
}

(function loadImages(){
  const keys = Object.keys(IMG_PATHS);
  let n = keys.length;
  let finished = false;
  function done(){
    if(finished) return;
    finished = true;
    imagesDone = true;
    tryBoot();
  }
  if(n===0){ done(); return; }
  keys.forEach(function(k){
    const image = new Image();
    image.onload = function(){ IMG[k] = image; if(--n<=0) done(); };
    image.onerror = function(){ IMG[k] = null; if(--n<=0) done(); };
    image.src = IMG_PATHS[k];
  });
  setTimeout(done, 6000);
})();

(function loadFonts(){
  const fontList = [
    '700 150px "Oswald"','600 60px "Oswald"','500 60px "Oswald"',
    '400 40px "Inter"','500 40px "Inter"','600 40px "Inter"','800 40px "Inter"'
  ];
  function done(){ if(fontsDone) return; fontsDone = true; tryBoot(); }
  if(document.fonts && document.fonts.load){
    Promise.all(fontList.map(function(f){ return document.fonts.load(f).catch(function(){}); }))
      .then(function(){ return document.fonts.ready; })
      .then(function(){ setTimeout(done, 30); })
      .catch(function(){ setTimeout(done, 30); });
    setTimeout(done, 4000);
  } else {
    setTimeout(done, 60);
  }
})();

})();
</script>
