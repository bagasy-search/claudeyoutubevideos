<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Box — a paper-cut explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#141210;height:100%;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;background:#f2ece0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
(function(){
"use strict";

/* ============================================================
   ONE BOX  —  a continuous-camera paper-collage explainer
   ============================================================ */

const W = 1920, H = 1080, END = 58;

const COL = {
  paper:'#f2ece0', ink:'#1b1b1b', yellow:'#f7c948',
  red:'#d64933', sea:'#2f6f8f', green:'#6b8f71', cream:'#fbf6ea'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', {alpha:false});

/* ---------------- utils ---------------- */
const clamp01 = v => v<0?0:v>1?1:v;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const easeIO = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* ---------------- paper grain (drawn once) ---------------- */
const GRAIN = (function(){
  const gw = 960, gh = 540;
  const cv = document.createElement('canvas');
  cv.width = gw; cv.height = gh;
  const g = cv.getContext('2d');
  const img = g.createImageData(gw, gh);
  const d = img.data;
  const rnd = mulberry32(20240117);
  for(let i=0;i<gw*gh;i++){
    const v = rnd();
    let c, a;
    if(v < 0.5){ c = 20; a = 26; } else { c = 255; a = 30; }
    const o = i*4;
    d[o]=c; d[o+1]=c; d[o+2]=c; d[o+3]=a;
  }
  g.putImageData(img,0,0);
  // fibres
  g.globalAlpha = 0.10;
  g.strokeStyle = '#4a3f2c';
  g.lineWidth = 1;
  const r2 = mulberry32(99);
  for(let i=0;i<420;i++){
    const x = r2()*gw, y = r2()*gh, a = r2()*Math.PI*2, len = 6+r2()*34;
    g.beginPath();
    g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*len*0.5+ (r2()-0.5)*10, y+Math.sin(a)*len*0.5+(r2()-0.5)*10, x+Math.cos(a)*len, y+Math.sin(a)*len);
    g.stroke();
  }
  return cv;
})();

/* ---------------- text ---------------- */
function T(s,x,y,size,o){
  o = o||{};
  ctx.save();
  const fam = o.family || 'Inter';
  ctx.font = (o.weight||600)+' '+size+'px "'+fam+'", sans-serif';
  ctx.fillStyle = o.color || COL.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.baseline || 'alphabetic';
  if(o.spacing) ctx.letterSpacing = o.spacing;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function M(s,size,weight,family){
  ctx.save();
  ctx.font = (weight||600)+' '+size+'px "'+(family||'Inter')+'", sans-serif';
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

/* ---------------- paper helpers ---------------- */
function setShadow(lift){
  ctx.shadowColor = 'rgba(27,27,27,'+(0.13+0.17*lift).toFixed(3)+')';
  ctx.shadowBlur = 8 + 14*lift;
  ctx.shadowOffsetX = 1 + 3*lift;
  ctx.shadowOffsetY = 3 + 6*lift;
}
function clearShadow(){
  ctx.shadowColor='rgba(0,0,0,0)'; ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
}

function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function tornRect(x,y,w,h,seed,amp){
  amp = amp===undefined?4:amp;
  const r = mulberry32(seed);
  const nx = Math.max(5, Math.round(w/58));
  const ny = Math.max(5, Math.round(h/58));
  ctx.beginPath();
  for(let i=0;i<=nx;i++){ const px=x+w*i/nx, py=y+(r()-0.5)*2*amp; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  for(let i=1;i<=ny;i++){ const px=x+w+(r()-0.5)*2*amp, py=y+h*i/ny; ctx.lineTo(px,py); }
  for(let i=1;i<=nx;i++){ const px=x+w-w*i/nx, py=y+h+(r()-0.5)*2*amp; ctx.lineTo(px,py); }
  for(let i=1;i<=ny;i++){ const px=x+(r()-0.5)*2*amp, py=y+h-h*i/ny; ctx.lineTo(px,py); }
  ctx.closePath();
}

function tape(x,y,w,h,rot){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.fillStyle='rgba(247,201,72,0.55)';
  ctx.fillRect(-w/2,-h/2,w,h);
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillRect(-w/2,-h/2,w,h*0.34);
  ctx.fillStyle='rgba(27,27,27,0.05)';
  ctx.fillRect(-w/2,h*0.3,w,h*0.2);
  ctx.restore();
}

function highlight(x,y,w,h,p,seed){
  if(p<=0) return;
  const ww = w*p;
  const r = mulberry32(seed||7);
  ctx.save();
  ctx.fillStyle='rgba(247,201,72,0.86)';
  ctx.beginPath();
  const n = Math.max(5, Math.round(ww/38));
  ctx.moveTo(x, y+(r()-0.5)*7);
  for(let i=1;i<=n;i++) ctx.lineTo(x+ww*i/n, y+(r()-0.5)*9);
  for(let i=n;i>=0;i--) ctx.lineTo(x+ww*i/n, y+h+(r()-0.5)*9);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function hlText(str,x,y,size,weight,family,p){
  const w = M(str,size,weight,family);
  highlight(x-7, y-size*0.72, w+14, size*0.60, p, (str.length*97+size*13)|0);
  return w;
}

function handCircle(cx,cy,rx,ry,p,rot,color,lw){
  if(p<=0) return;
  const N = 72;
  ctx.save();
  ctx.strokeStyle = color||COL.ink;
  ctx.lineWidth = lw||4;
  ctx.lineCap='round';
  ctx.beginPath();
  const upto = Math.floor(N*p);
  for(let i=0;i<=upto;i++){
    const a = (i/N)*Math.PI*2 + (rot||0);
    const wob = 1 + 0.035*Math.sin(i*1.9) + 0.02*Math.cos(i*0.7);
    const px = cx + Math.cos(a)*rx*wob;
    const py = cy + Math.sin(a)*ry*wob;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.stroke();
  ctx.restore();
}

function handArrow(x1,y1,x2,y2,p,color,lw){
  if(p<=0) return;
  const mx = (x1+x2)/2 + (y2-y1)*0.16;
  const my = (y1+y2)/2 - (x2-x1)*0.16;
  const steps = 34;
  const upto = Math.max(1,Math.floor(steps*p));
  ctx.save();
  ctx.strokeStyle = color||COL.ink;
  ctx.lineWidth = lw||4;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  let lx=x1, ly=y1;
  for(let i=0;i<=upto;i++){
    const s=i/steps, is=1-s;
    const px = is*is*x1 + 2*is*s*mx + s*s*x2;
    const py = is*is*y1 + 2*is*s*my + s*s*y2;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    lx=px; ly=py;
  }
  ctx.stroke();
  if(p>0.85){
    const ang = Math.atan2(y2-ly, x2-lx) || Math.atan2(y2-my, x2-mx);
    const hl = (lw||4)*4.5;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - Math.cos(ang-0.42)*hl, y2 - Math.sin(ang-0.42)*hl);
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - Math.cos(ang+0.42)*hl, y2 - Math.sin(ang+0.42)*hl);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- container / crate art ---------------- */
function containerSide(x,y,w,h,col,doorRight){
  ctx.fillStyle = col;
  rr(x,y,w,h,3);
  ctx.fill();
  clearShadow();
  // top light
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(x+2,y+2,w-4,Math.max(2,h*0.10));
  // bottom shade
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.fillRect(x+2,y+h-Math.max(2,h*0.11),w-4,Math.max(2,h*0.11));
  // ribs
  ctx.strokeStyle='rgba(0,0,0,0.14)';
  ctx.lineWidth=Math.max(1.4,w*0.007);
  const n = Math.max(5, Math.round(w/24));
  ctx.beginPath();
  for(let i=1;i<n;i++){
    const rx = x+6+(w-12)*i/n;
    ctx.moveTo(rx,y+h*0.14); ctx.lineTo(rx,y+h*0.86);
  }
  ctx.stroke();
  // corner castings
  const cw = Math.min(w*0.05,15), ch = Math.min(h*0.24,17);
  ctx.fillStyle='rgba(27,27,27,0.82)';
  ctx.fillRect(x+1,y+1,cw,ch);
  ctx.fillRect(x+w-cw-1,y+1,cw,ch);
  ctx.fillRect(x+1,y+h-ch-1,cw,ch);
  ctx.fillRect(x+w-cw-1,y+h-ch-1,cw,ch);
  // door seam
  const dx = doorRight ? x+w-8 : x+w-8;
  ctx.strokeStyle='rgba(0,0,0,0.26)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(dx,y+h*0.13); ctx.lineTo(dx,y+h*0.87); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dx-5,y+h*0.24); ctx.lineTo(dx-5,y+h*0.76); ctx.stroke();
}

function crate(x,y,w,h,col,seed){
  ctx.fillStyle=col;
  ctx.fillRect(x,y,w,h);
  clearShadow();
  ctx.strokeStyle='rgba(27,27,27,0.42)';
  ctx.lineWidth=2;
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.beginPath();
  ctx.moveTo(x+2,y+2); ctx.lineTo(x+w-2,y+h-2);
  ctx.moveTo(x+w-2,y+2); ctx.lineTo(x+2,y+h-2);
  ctx.stroke();
}

function person(x,y,s,col){
  ctx.save();
  ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = col||COL.ink;
  ctx.beginPath(); ctx.arc(0,-30,9.5,0,Math.PI*2); ctx.fill();
  rr(-10,-19,20,28,6); ctx.fill();
  ctx.fillRect(-8,8,6,18);
  ctx.fillRect(2,8,6,18);
  ctx.fillRect(-14,-16,5,18);
  ctx.fillRect(9,-16,5,18);
  ctx.restore();
}

/* ---------------- camera ---------------- */
const STARTS = [0,5.5,11,16.5,22.5,28.5,34.5,41,48,54];
const CX = [0,1800,3600,5400,7200,9000,10800,12600,14400,16200];

const CAMS = [
  [0.0,  -300, -80, 1.55],
  [3.2,     0,   0, 1.02],
  [4.8,    12,  -4, 1.03],
  [6.0,   900, -18, 0.62],
  [7.1,  1800,   0, 1.02],
  [10.2, 1830,  -6, 1.05],
  [11.3, 2700, -20, 0.64],
  [12.4, 3600,   0, 1.02],
  [15.8, 3620,  -6, 1.05],
  [16.9, 4500, -20, 1.22],
  [18.0, 5400,   0, 1.02],
  [22.0, 5420,  -6, 1.05],
  [23.1, 6300, -20, 0.62],
  [24.2, 7200,   0, 1.00],
  [28.0, 7220,  -6, 1.04],
  [29.1, 8100, -20, 0.64],
  [30.2, 9000,   0, 1.02],
  [34.0, 9020,  -6, 1.05],
  [35.1, 9900, -20, 0.63],
  [36.2,10800,   0, 1.02],
  [40.4,10820,  -6, 1.05],
  [41.5,11700, -20, 0.62],
  [42.6,12600,   0, 1.02],
  [47.4,12620,  -6, 1.05],
  [48.5,13500, -20, 0.60],
  [49.6,14400,   0, 1.00],
  [53.4,14420,  -6, 1.04],
  [54.5,15300, -20, 1.55],
  [55.6,16200,   0, 2.70],
  [57.4,16200,  -4, 0.66],
  [58.0,16200,  -8, 0.62]
];

function camAt(t){
  const K = CAMS;
  let i = 0;
  while(i < K.length-2 && t > K[i+1][0]) i++;
  const a = K[i], b = K[i+1];
  let u = clamp01((t-a[0])/(b[0]-a[0]));
  u = easeIO(u);
  const x = lerp(a[1],b[1],u);
  const y = lerp(a[2],b[2],u);
  const z = lerp(a[3],b[3],u);
  return {
    x: x + Math.sin(t*0.71)*5.5,
    y: y + Math.sin(t*0.53+1.2)*6.5,
    z: z * (1 + Math.sin(t*0.87)*0.005),
    rot: Math.sin(t*0.31)*0.0034
  };
}

function applyLayer(k, cam){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.translate(W/2, H/2);
  ctx.rotate(cam.rot*k);
  const s = 1 + (cam.z-1)*k;
  ctx.scale(s,s);
  ctx.translate(-cam.x*k, -cam.y*k);
}

function layerRange(cam,k,pad){
  const s = 1 + (cam.z-1)*k;
  const hw = (W/2+ (pad||0))/s;
  const hh = (H/2+ (pad||0))/s;
  const cx = cam.x*k, cy = cam.y*k;
  return {x0:cx-hw, x1:cx+hw, y0:cy-hh, y1:cy+hh, s:s};
}

/* ============================================================
   SCENES
   ============================================================ */

/* ---------- 0 : TITLE ---------- */
function scene0(t,lt){
  const bob = Math.sin(t*1.05)*3;
  ctx.save();
  ctx.translate(0,bob);

  setShadow(0.45);
  ctx.fillStyle = COL.cream;
  tornRect(-660,-410,1320,820,101,5);
  ctx.fill();
  clearShadow();

  ctx.strokeStyle='rgba(47,111,143,0.085)';
  ctx.lineWidth=2;
  for(let i=0;i<13;i++){
    ctx.beginPath(); ctx.moveTo(-622,-388+i*64); ctx.lineTo(622,-388+i*64); ctx.stroke();
  }

  tape(-600,-392,200,56,-0.26);
  tape(556,380,200,56,0.20);
  tape(-570,394,200,56,0.10);

  T('AN EXPLAINER IN ONE TAKE', -606,-330, 23, {weight:600, color:'rgba(27,27,27,0.42)', spacing:'7px'});

  const p1 = clamp01((lt-0.30)/0.35);
  hlText('ONE BOX', -606,-186, 148, 700, 'Oswald', p1);
  T('ONE BOX', -606,-186, 148, {weight:700, family:'Oswald', color:COL.ink});

  T('why every container on Earth', -604,-64, 45, {weight:600, color:COL.ink});
  T('ended up exactly the same size', -604,-8, 45, {weight:600, color:COL.ink});

  ctx.strokeStyle=COL.ink; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-604,34); ctx.lineTo(120,34); ctx.stroke();

  // hero container
  ctx.save();
  ctx.translate(395,200); ctx.rotate(-0.05);
  setShadow(0.75);
  containerSide(-195,-80,390,160, COL.red, true);
  ctx.restore();

  const ap = clamp01((lt-1.15)/0.5);
  handArrow(140,66,214,120, ap, COL.ink, 3.5);
  T('40 ft · 12.2 m', 200, 300, 30, {weight:700, color:COL.red});
  T('the most boring object on Earth', 200, 340, 24, {weight:500, color:'rgba(27,27,27,0.55)'});

  const cp = clamp01((lt-1.9)/0.6);
  handCircle(395,200, 232, 118, cp, -0.15, COL.ink, 3);

  ctx.restore();
}

/* ---------- 1 : BEFORE 1956 ---------- */
function scene1(t,lt){
  // sea
  setShadow(0.25);
  ctx.fillStyle = COL.sea;
  tornRect(-800,-90,1600,320,201,6);
  ctx.fill();
  clearShadow();

  ctx.strokeStyle='rgba(255,255,255,0.22)';
  ctx.lineWidth=3; ctx.lineCap='round';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    for(let x=-780;x<=780;x+=30){
      const y = -40+i*44 + Math.sin(x*0.017+t*1.8+i)*5;
      if(x===-780) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // ship
  setShadow(0.35);
  ctx.fillStyle = COL.ink;
  ctx.beginPath();
  ctx.moveTo(-540,62); ctx.lineTo(430,62); ctx.lineTo(520,172); ctx.lineTo(-600,172);
  ctx.closePath(); ctx.fill();
  clearShadow();

  ctx.fillStyle = COL.cream;
  ctx.fillRect(-540,54,970,9);

  // superstructure
  ctx.fillStyle=COL.ink;
  ctx.fillRect(296,-72,124,134);
  ctx.fillStyle=COL.cream;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) ctx.fillRect(310+i*34, -52+j*36, 18, 20);
  ctx.fillStyle=COL.red;
  ctx.fillRect(318,-124,48,54);

  // mast + derrick
  ctx.strokeStyle=COL.ink; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-320,56); ctx.lineTo(-320,-196); ctx.stroke();
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(-320,-176); ctx.lineTo(70,-140); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-320,-150); ctx.lineTo(-520,-60); ctx.stroke();

  // dock
  setShadow(0.3);
  ctx.fillStyle = COL.cream;
  tornRect(-830,230,1660,175,202,5);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle='rgba(27,27,27,0.16)'; ctx.lineWidth=2;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-820,262+i*36); ctx.lineTo(820,262+i*36); ctx.stroke(); }

  // workers
  person(-618,338,1.12,COL.ink);
  person(-500,346,1.02,COL.ink);
  person(120,344,1.06,COL.ink);

  // static crates & sacks
  ctx.save(); setShadow(0.3);
  crate(-760,290,68,68,COL.green,3);
  crate(-690,300,60,60,COL.sea,4);
  crate(-300,296,64,64,COL.red,5);
  crate(-240,306,54,54,COL.green,6);
  ctx.restore();

  // sack shapes
  ctx.save(); setShadow(0.28);
  ctx.fillStyle='#cbbfa5';
  ctx.beginPath(); ctx.ellipse(-430,326,34,26,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-372,332,30,22,-0.15,0,Math.PI*2); ctx.fill();
  clearShadow(); ctx.restore();

  // animated lifted crate
  const p = easeIO(clamp01((lt-0.7)/3.9));
  const cxp = 190 + Math.sin((1-p)*7)*26*(1-p);
  const cyp = lerp(304, 18, p);
  const swing = Math.sin(p*7)*0.14*(1-p);

  ctx.strokeStyle='rgba(27,27,27,0.85)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(70,-140); ctx.lineTo(cxp+30, cyp); ctx.stroke();

  ctx.save();
  ctx.translate(cxp+30, cyp+30); ctx.rotate(swing);
  setShadow(0.6);
  crate(-30,-30,60,60,COL.yellow,7);
  ctx.restore();

  // labels
  const hl = clamp01((lt-0.15)/0.35);
  hlText('BEFORE 1956', -780,-352, 84, 700, 'Oswald', hl);
  T('BEFORE 1956', -780,-352, 84, {weight:700, family:'Oswald', color:COL.ink});
  T('hand loaded · crate by crate', -778,-286, 28, {weight:600, color:'rgba(27,27,27,0.62)'});
}

/* ---------- 2 : A WEEK IN PORT ---------- */
function scene2(t,lt){
  setShadow(0.4);
  ctx.fillStyle = COL.cream;
  tornRect(-620,-410,1240,760,301,5);
  ctx.fill();
  clearShadow();

  tape(-596,-424,170,50,-0.22);
  tape(470,336,170,50,0.16);

  T('IN PORT', -566,-330, 62, {weight:700, family:'Oswald', color:COL.ink});
  T('a ship could wait a week', -564,-274, 28, {weight:600, color:'rgba(27,27,27,0.6)'});

  // day chips
  for(let i=0;i<7;i++){
    const x = -566 + i*130;
    const on = clamp01((lt-0.35-i*0.33)/0.24);
    ctx.save();
    setShadow(0.15*on);
    ctx.fillStyle = 'rgba(27,27,27,'+(0.10+0.86*on).toFixed(3)+')';
    rr(x,-180,100,96,9);
    ctx.fill();
    clearShadow();
    ctx.restore();

  }
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}

function scene8(t,lt){
  const hlp = clamp01((lt-0.15)/0.35);
  hlText('NINETY PERCENT', -800,-392, 66, 700, 'Oswald', hlp);
  T('NINETY PERCENT', -800,-392, 66, {weight:700, family:'Oswald', color:COL.ink});

  const cnt = Math.round(90*easeIO(clamp01((lt-0.5)/2.0)));
  T(cnt+'%', -800,-150, 216, {weight:700, family:'Oswald', color:COL.ink});
  T('of everything you own', -796,-96, 32, {weight:600, color:'rgba(27,27,27,0.7)'});
  T('travelled in a box', -796,-54, 32, {weight:600, color:'rgba(27,27,27,0.7)'});

  handCircle(-660,-216, 152, 112, clamp01((lt-2.4)/0.7), 0.12, 'rgba(214,73,51,0.85)', 5);

  // map panel
  const mx = 40, my = -290, mw = 760, mh = 540;
  setShadow(0.4);
  ctx.fillStyle='rgba(47,111,143,0.14)';
  tornRect(mx,my,mw,mh,801,5);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle='rgba(47,111,143,0.4)'; ctx.lineWidth=2;
  tornRect(mx,my,mw,mh,801,5); ctx.stroke();

  for(let i=0;i<CONTINENTS.length;i++){
    blob(CONTINENTS[i], mx, my, mw, mh, 'rgba(107,143,113,0.85)', 900+i);
  }

  // routes
  const routes = [[0,4],[0,5],[2,3],[3,6],[1,2]];
  for(let i=0;i<routes.length;i++){
    const a = PORTS[routes[i][0]], b = PORTS[routes[i][1]];
    const p0x = mx+a[0]*mw, p0y = my+a[1]*mh;
    const p1x = mx+b[0]*mw, p1y = my+b[1]*mh;
    const ctrlx = (p0x+p1x)/2 + (p1y-p0y)*0.32;
    const ctrly = (p0y+p1y)/2 - (p1x-p0x)*0.32;
    const rp = clamp01((lt-1.2-i*0.28)/1.3);
    if(rp<=0) continue;

    ctx.save();
    ctx.strokeStyle='rgba(27,27,27,0.55)';
    ctx.lineWidth=3;
    ctx.setLineDash([11,9]);
    ctx.lineDashOffset = -t*24;
    ctx.beginPath();
    const N = 40, upto = Math.floor(N*rp);
    let lx=0, ly=0;
    for(let k=0;k<=upto;k++){
      const s=k/N, is=1-s;
      const px = is*is*p0x + 2*is*s*ctrlx + s*s*p1x;
      const py = is*is*p0y + 2*is*s*ctrly + s*s*p1y;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py);
      lx=px; ly=py;
    }
    ctx.stroke();
    ctx.restore();

    if(rp<1){
      ctx.save();
      setShadow(0.7);
      ctx.fillStyle=COL.yellow;
      rr(lx-11,ly-7,22,14,2); ctx.fill();
      clearShadow();
      ctx.restore();
    }
    ctx.save();
    ctx.fillStyle='rgba(214,73,51,0.95)';
    ctx.beginPath(); ctx.arc(p0x,p0y,7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p1x,p1y,7,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  T('every route, one box', 40, 292, 26, {weight:600, color:'rgba(27,27,27,0.62)'});
}

/* ---------- 9 : ONE AMONG MILLIONS ---------- */
const GRID = (function(){
  const r = mulberry32(4242);
  const cols=38, rows=26, cw=90, ch=44, gx=6, gy=6;
  const ox = -(cols*(cw+gx))/2, oy = -(rows*(ch+gy))/2;
  const out = [];
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const v = r();
      let col = COL.red;
      if(v<0.34) col = COL.red;
      else if(v<0.62) col = COL.sea;
      else if(v<0.86) col = COL.green;
      else col = '#c9903f';
      out.push({x:ox+i*(cw+gx), y:oy+j*(ch+gy), w:cw, h:ch, c:col, hi:(i===19&&j===13)});
    }
  }
  return {items:out, cw:cw, ch:ch, cols:cols, rows:rows, w:cols*(cw+gx), h:rows*(ch+gy)};
})();

function scene9(t,lt){
  // backdrop sheet
  setShadow(0.3);
  ctx.fillStyle='#efe7d8';
  tornRect(-2050,-780,4100,1560,901,8);
  ctx.fill();
  clearShadow();

  // batch by colour
  const groups = {};
  for(let i=0;i<GRID.items.length;i++){
    const it = GRID.items[i];
    if(!groups[it.c]) groups[it.c]=[];
    groups[it.c].push(it);
  }
  for(const c in groups){
    const arr = groups[c];
    ctx.beginPath();
    for(let i=0;i<arr.length;i++){
      const a=arr[i];
      ctx.rect(a.x, a.y, a.w, a.h);
    }
    ctx.fillStyle=c;
    ctx.fill();
  }
  // top highlights
  ctx.beginPath();
  for(let i=0;i<GRID.items.length;i++){
    const a=GRID.items[i];
    ctx.rect(a.x, a.y, a.w, 6);
  }
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.fill();

  // ribs
  ctx.beginPath();
  for(let i=0;i<GRID.items.length;i++){
    const a=GRID.items[i];
    ctx.moveTo(a.x+a.w*0.33, a.y+7); ctx.lineTo(a.x+a.w*0.33, a.y+a.h-7);
    ctx.moveTo(a.x+a.w*0.66, a.y+7); ctx.lineTo(a.x+a.w*0.66, a.y+a.h-7);
  }
  ctx.strokeStyle='rgba(0,0,0,0.10)';
  ctx.lineWidth=2;
  ctx.stroke();

  // highlighted container
  const hi = GRID.items.find(it=>it.hi);
  if(hi){
    ctx.save();
    setShadow(1.0);
    ctx.fillStyle = COL.yellow;
    rr(hi.x-2, hi.y-2, hi.w+4, hi.h+4, 3);
    ctx.fill();
    clearShadow();
    ctx.restore();
    containerSide(hi.x, hi.y, hi.w, hi.h, COL.red, true);
  }

  const cp = clamp01((lt-1.2)/0.8);
  if(hi){
    handCircle(hi.x+hi.w/2, hi.y+hi.h/2, hi.w*1.25, hi.h*1.6, cp, 0.2, COL.ink, 3.5);
  }

  // end titles live in the world
  const tp = clamp01((lt-2.4)/0.7);
  if(tp>0){
    ctx.save();
    ctx.globalAlpha = tp;
    T('ONE BOX', -1850, 700, 96, {weight:700, family:'Oswald', color:COL.ink});
    T('among roughly fifty million', -1846, 758, 30, {weight:600, color:'rgba(27,27,27,0.6)'});
    ctx.restore();
  }
}

/* ============================================================
   SCENE TABLE + LAYERS
   ============================================================ */
const SCENE_FNS = [scene0,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9];
const SCENE_EXT = [900,1000,800,1000,900,1000,1000,900,1000,2400];

function drawMain(t,cam){
  const R = layerRange(cam,1,900);
  for(let i=0;i<SCENE_FNS.length;i++){
    const cx = CX[i], ext = SCENE_EXT[i];
    if(cx+ext < R.x0 || cx-ext > R.x1) continue;
    ctx.save();
    ctx.translate(cx,0);
    SCENE_FNS[i](t, t-STARTS[i]);
    ctx.restore();
  }
}

function drawFar(cam){
  const R = layerRange(cam,0.28,900);
  const cell = 760;
  const i0 = Math.floor(R.x0/cell)-1, i1 = Math.ceil(R.x1/cell)+1;
  const j0 = Math.floor(R.y0/cell)-1, j1 = Math.ceil(R.y1/cell)+1;
  for(let i=i0;i<=i1;i++){
    for(let j=j0;j<=j1;j++){
      const r = mulberry32(i*7919 + j*104729 + 13);
      const x = i*cell + r()*220;
      const y = j*cell + r()*220;
      const s = 380 + r()*360;
      const rot = (r()-0.5)*0.5;
      const warm = r();
      ctx.save();
      ctx.translate(x,y); ctx.rotate(rot);
      ctx.fillStyle = warm>0.5 ? 'rgba(251,246,234,0.62)' : 'rgba(47,111,143,0.045)';
      ctx.fillRect(-s/2,-s/2,s,s);
      ctx.restore();
    }
  }
}

function drawMid(t,cam){
  const R = layerRange(cam,0.62,900);
  const ghosts = [
    [1800,'1956'],[5400,'IDEA'],[9000,'1965'],[12600,'−98%'],[14400,'90%']
  ];
  for(let i=0;i<ghosts.length;i++){
    const g = ghosts[i];
    if(g[0]+1200 < R.x0 || g[0]-1200 > R.x1) continue;
    ctx.save();
    ctx.globalAlpha = 0.045;
    T(g[1], g[0], 200, 520, {weight:700, family:'Oswald', color:COL.ink, align:'center'});
    ctx.restore();
  }
  // faint horizontal rules across the world
  ctx.strokeStyle='rgba(27,27,27,0.05)';
  ctx.lineWidth=2;
  const y0 = Math.floor(R.y0/120)*120;
  for(let y=y0;y<R.y1;y+=120){
    ctx.beginPath(); ctx.moveTo(R.x0,y); ctx.lineTo(R.x1,y); ctx.stroke();
  }
}

function drawNear(t,cam){
  const R = layerRange(cam,1.5,900);
  const cell = 1600;
  const i0 = Math.floor(R.x0/cell), i1 = Math.ceil(R.x1/cell);
  const j0 = Math.floor(R.y0/cell), j1 = Math.ceil(R.y1/cell);
  for(let i=i0;i<=i1;i++){
    for(let j=j0;j<=j1;j++){
      const r = mulberry32(i*31337 + j*911 + 7);
      for(let k=0;k<2;k++){
        const x = i*cell + r()*cell;
        const y = j*cell + r()*cell;
        const s = 55 + r()*80;
        const a = r()*Math.PI;
        const yellow = r()>0.62;
        const dx = Math.sin(t*0.5 + k*1.7 + i)*18;
        const dy = Math.cos(t*0.42 + j*1.3)*14;
        ctx.save();
        ctx.translate(x+dx, y+dy);
        ctx.rotate(a);
        setShadow(1.0);
        ctx.fillStyle = yellow ? 'rgba(247,201,72,0.55)' : 'rgba(251,246,234,0.95)';
        tornRect(-s/2,-s*0.36,s,s*0.72, i*17+j*31+k+5, 3);
        ctx.fill();
        clearShadow();
        ctx.restore();
      }
    }
  }
}

/* ---------------- paper wipe during camera transitions ---------------- */
function drawWipe(t){
  for(let i=1;i<STARTS.length;i++){
    const dep = STARTS[i]-0.9, arr = STARTS[i]+1.0;
    if(t < dep || t > arr) continue;
    const p = clamp01((t-dep)/(arr-dep));
    const cx = W+1500 - p*(W+3000);
    ctx.save();
    ctx.translate(cx, H/2);
    ctx.rotate(0.17);
    ctx.shadowColor='rgba(27,27,27,0.30)';
    ctx.shadowBlur=46; ctx.shadowOffsetX=-34; ctx.shadowOffsetY=14;
    ctx.fillStyle=COL.cream;
    tornRect(-1250,-850,2500,1700, 777+i, 11);
    ctx.fill();
    clearShadow();

    ctx.strokeStyle='rgba(47,111,143,0.10)';
    ctx.lineWidth=2;
    for(let k=0;k<22;k++){
      ctx.beginPath(); ctx.moveTo(-1180,-780+k*72); ctx.lineTo(1180,-780+k*72); ctx.stroke();
    }
    tape(-1000,-560,220,60,-0.3);
    tape(980,600,220,60,0.24);
    T('ONE BOX', 0, 30, 120, {weight:700, family:'Oswald', color:'rgba(27,27,27,0.10)', align:'center'});
    ctx.restore();
  }
}

/* ---------------- grain / vignette ---------------- */
function drawGrain(){
  ctx.save();
  ctx.globalAlpha = 0.62;
  ctx.drawImage(GRAIN, 0, 0, W, H);
  ctx.restore();
}
function drawVignette(t){
  const a = 0.10 + 0.020*Math.sin(t*2.3) + 0.012*Math.sin(t*5.7+1.1);
  const g = ctx.createRadialGradient(W/2,H/2,H*0.32, W/2,H/2,H*1.02);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(30,22,10,'+a.toFixed(3)+')');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

/* ---------------- subtitles ---------------- */
const SUBS = [
  [0.0,5.5,"Every shipping container on Earth is basically the same box"],
  [5.5,11.0,"Before 1956, ships were loaded by hand, one sack and one crate at a time"],
  [11.0,16.5,"A ship could sit in port for a week, and a lot of the cargo simply disappeared"],
  [16.5,22.5,"Then a trucker named Malcolm McLean had an idea: load the whole trailer onto the ship"],
  [22.5,28.5,"It worked. But soon every company built its own box, in its own size"],
  [28.5,34.5,"Cranes, trucks and trains didn't fit each other, so in the 1960s the world agreed on one standard"],
  [34.5,41.0,"Twenty feet long. Forty feet long. The same corners, the same locks, everywhere"],
  [41.0,48.0,"Loading time fell from days to hours, and the cost of shipping collapsed"],
  [48.0,54.0,"Today about ninety percent of everything you own travelled inside one of these"],
  [54.0,58.0,"One boring box that quietly built the modern world"]
];

function drawSubs(t){
  for(let i=0;i<SUBS.length;i++){
    const s = SUBS[i];
    if(t < s[0]-0.05 || t > s[1]+0.05) continue;
    let a = 1;
    if(t < s[0]+0.25) a = (t-s[0])/0.25;
    if(t > s[1]-0.25) a = Math.min(a,(s[1]-t)/0.25);
    a = clamp01(a);
    if(a<=0) continue;

    const FS = 40, MAXW = 1360;
    ctx.save();
    ctx.font = '500 '+FS+'px "Inter", sans-serif';
    const words = s[2].split(' ');
    const lines = [];
    let cur = '';
    for(let w=0;w<words.length;w++){
      const test = cur ? cur+' '+words[w] : words[w];
      if(ctx.measureText(test).width > MAXW && cur){
        lines.push(cur); cur = words[w];
      } else cur = test;
    }
    if(cur) lines.push(cur);
    ctx.restore();

    let maxw = 0;
    ctx.save();
    ctx.font = '500 '+FS+'px "Inter", sans-serif';
    for(const l of lines) maxw = Math.max(maxw, ctx.measureText(l).width);
    ctx.restore();

    const padX = 44, padY = 26, lh = 54;
    const bw = Math.min(MAXW+padX*2, maxw + padX*2);
    const bh = lines.length*lh + padY*2 - 12;
    const bx = W/2, byTop = 1012 - bh;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle='rgba(20,18,16,0.80)';
    rr(bx-bw/2, byTop, bw, bh, 20);
    ctx.fill();

    ctx.fillStyle='#ffffff';
    ctx.font='500 '+FS+'px "Inter", sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    for(let l=0;l<lines.length;l++){
      ctx.fillText(lines[l], bx, byTop + padY + lh*l + lh/2 - 6);
    }
    ctx.restore();
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(t){
  t = clamp(t, 0, END);
  const cam = camAt(t);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = COL.paper;
  ctx.fillRect(0,0,W,H);

  // far layer
  applyLayer(0.28, cam);
  drawFar(cam);

  // mid layer
  applyLayer(0.62, cam);
  drawMid(t, cam);

  // motion-blur ghosts (main layer only)
  const cPrev = camAt(Math.max(0, t-0.05));
  const spd = Math.abs(cam.x - cPrev.x) * cam.z / 0.05;
  if(spd > 900){
    const gA = Math.min(0.20, (spd-900)/7000 + 0.07);
    ctx.globalAlpha = gA;
    const tg = Math.max(0, t-0.035);
    const cg = camAt(tg);
    applyLayer(1, cg);
    drawMain(tg, cg);
    ctx.globalAlpha = 1;
  }

  // main layer
  applyLayer(1, cam);
  drawMain(t, cam);

  // near layer
  applyLayer(1.5, cam);
  drawNear(t, cam);

  ctx.setTransform(1,0,0,1,0,0);

  drawWipe(t);
  drawGrain();
  drawVignette(t);
  drawSubs(t);
}

/* ============================================================
   BOOT / API
   ============================================================ */
window.END = END;
window.READY = false;

let paused = false;
let clockStart = null;

function loop(ts){
  if(clockStart === null) clockStart = ts;
  if(!paused){
    const t = (ts - clockStart)/1000;
    render(t > END ? END : t);
  }
  requestAnimationFrame(loop);
}

window.seek = async function(t){
  paused = true;
  render(t);
  return true;
};

window.play = function(){
  paused = false;
  clockStart = performance.now();
};

function boot(){
  render(0);
  window.READY = true;
  requestAnimationFrame(loop);
}

const fontList = [
  '700 150px "Oswald"','600 60px "Oswald"','500 60px "Oswald"',
  '400 40px "Inter"','500 40px "Inter"','600 40px "Inter"','800 40px "Inter"'
];
let booted = false;
function tryBoot(){
  if(booted) return;
  booted = true;
  boot();
}
if(document.fonts && document.fonts.load){
  Promise.all(fontList.map(f=>document.fonts.load(f).catch(()=>{})))
    .then(()=>document.fonts.ready)
    .then(()=>{ setTimeout(tryBoot, 30); })
    .catch(()=>{ setTimeout(tryBoot, 30); });
  setTimeout(tryBoot, 3500);
} else {
  setTimeout(tryBoot, 60);
}

})();
