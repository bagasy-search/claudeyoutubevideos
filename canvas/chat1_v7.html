<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto}
</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* ============================================================
   APOLLO 11 — ALARM 1202   ·   one continuous camera move
   ============================================================ */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;

const COL = {
  paper:'#f1ebdd', paper2:'#e7dcc6', ink:'#151515', ink2:'#3a352c',
  yellow:'#f6c443', red:'#e0482f', blue:'#1d3b6a', teal:'#3f7f7a',
  cream:'#fbf8ef', navy:'#101623'
};

const T = { p2:6.6, p3:15.6, p4:24.2, p5:31.6, p6:41.8, p7:54.6, pull:66.0, end:76.5 };
const TRD = 0.62;
window.END = T.end;

window.NARRATION = [
  {t:0.7,  text:"July 20th, 1969. Down here, the Moon is coming up fast."},
  {t:5.6,  text:"Three minutes before landing, the Eagle's computer lights up: alarm 1202."},
  {t:11.6, text:"Nobody inside the spacecraft knows what that means."},
  {t:16.2, text:"The machine flying the landing held two thousand words of memory. A single photo on your phone is bigger."},
  {t:24.6, text:"It was juggling radar, guidance and alarms all at once, and it ran out of time."},
  {t:31.8, text:"In Houston, an engineer named Jack Garman recognised the code. He had seen it in a simulation."},
  {t:39.2, text:"His call: keep going."},
  {t:42.0, text:"Armstrong kept flying. He levelled off and shot across a crater field, hunting for flat ground."},
  {t:48.8, text:"Fuel was the clock. Twenty seconds left when the dust rose."},
  {t:55.0, text:"One hundred and two hours, forty-five minutes, forty seconds: the Eagle has landed."},
  {t:62.0, text:"The alarm cost them nothing but a scare, because one person on the ground had already done the maths."},
  {t:70.4, text:"Two thousand words. And a whole world watching."}
];
const NARR_WPS = 2.5;
const narrEnd = i => {
  const n = window.NARRATION; if(!n[i]) return T.end;
  const words = n[i].text.trim().split(/\s+/).length;
  return n[i].t + words / NARR_WPS + 0.3;
};

const cl = (v,a=0,b=1) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const ss  = t => { t = cl(t); return t*t*(3-2*t); };
const eio = t => { t = cl(t); return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; };
const eo3 = t => 1-Math.pow(1-cl(t),3);
const eob = t => { t=cl(t); const c=1.9; return 1+c*Math.pow(t-1,3)+1.6*Math.pow(t-1,2); };
const prog = (t,a,b) => cl((t-a)/((b-a)||1),0,1);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- camera ---------------- */
const CAMK = [
  [0.0,   6, -14, 1.05, -0.45],
  [6.6,  16,   6, 1.09,  0.35],
  [15.6,-12,  -6, 1.02, -0.30],
  [24.2, 10,  -9, 1.06,  0.40],
  [31.6,-16,   5, 1.03, -0.35],
  [41.8,  4, -12, 1.09,  0.30],
  [54.6,  9,   6, 1.12, -0.20],
  [66.0,  0,   0, 0.98,  0.10],
  [76.5, -9,  -7, 1.03,  0.00]
];
let CAM = {x:0,y:0,z:1,r:0};
function camAt(t){
  let i=0; while(i<CAMK.length-2 && t>CAMK[i+1][0]) i++;
  const a=CAMK[i], b=CAMK[i+1];
  let u = cl((t-a[0])/((b[0]-a[0])||1));
  u = ss(u);
  const dx = 0.9*Math.sin(t*0.41) + 0.5*Math.sin(t*0.17+1.3);
  const dy = 0.7*Math.cos(t*0.33) + 0.4*Math.cos(t*0.21);
  return {
    x: lerp(a[1],b[1],u)+dx,
    y: lerp(a[2],b[2],u)+dy,
    z: lerp(a[3],b[3],u),
    r: (lerp(a[4],b[4],u) + 0.22*Math.sin(t*0.27))*Math.PI/180
  };
}
let G = ctx;
function L(c,d){
  const z = 1+(CAM.z-1)*d;
  c.translate(W/2,H/2);
  c.translate(-CAM.x*d, -CAM.y*d);
  c.rotate(CAM.r*d);
  c.scale(z,z);
  c.translate(-W/2,-H/2);
}

/* ---------------- type ---------------- */
function txt(c,s,x,y,o){
  o = o||{};
  const size=o.size||40, weight=o.weight||600, fam=o.fam||'Inter';
  c.save();
  c.font = weight+' '+size+'px '+fam;
  c.fillStyle = o.col||COL.ink;
  c.textAlign = o.align||'left';
  c.textBaseline = o.base||'alphabetic';
  c.globalAlpha = (o.alpha===undefined?1:o.alpha);
  if(o.glow){ c.shadowColor=o.glow; c.shadowBlur=o.glowBlur||18; }
  else if(o.shadow){ c.shadowColor='rgba(18,12,4,0.5)'; c.shadowBlur=o.shadow; c.shadowOffsetY=o.shadowY||4; }
  const ls = o.ls||0;
  if(ls){
    const chars=[...String(s)];
    let total=0;
    for(const ch of chars) total += c.measureText(ch).width + ls;
    total -= ls;
    let px = (c.textAlign==='center') ? x-total/2 : (c.textAlign==='right' ? x-total : x);
    c.textAlign='left';
    for(const ch of chars){ c.fillText(ch,px,y); px += c.measureText(ch).width+ls; }
  } else {
    c.fillText(String(s),x,y);
  }
  c.restore();
}
function txtW(c,s,size,weight,fam,ls){
  c.save(); c.font=(weight||600)+' '+(size||40)+'px '+(fam||'Inter');
  const chars=[...String(s)]; let total=0;
  for(const ch of chars) total += c.measureText(ch).width + (ls||0);
  c.restore();
  return total - (ls||0);
}

/* ---------------- textures ---------------- */
let GRAINP=null, VIG=null;
function buildTextures(){
  const g=document.createElement('canvas'); g.width=512; g.height=512;
  const gc=g.getContext('2d');
  const r=mulberry32(4242);
  const img=gc.createImageData(512,512);
  for(let i=0;i<512*512;i++){
    const v = 224 + Math.floor(r()*32);
    img.data[i*4]=v; img.data[i*4+1]=v-3; img.data[i*4+2]=v-8; img.data[i*4+3]=255;
  }
  gc.putImageData(img,0,0);
  gc.globalAlpha=0.45; gc.strokeStyle='rgba(150,132,104,0.5)';
  for(let i=0;i<170;i++){
    const x=r()*512,y=r()*512,l=6+r()*44,a=r()*Math.PI;
    gc.beginPath(); gc.moveTo(x,y); gc.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); gc.stroke();
  }
  GRAINP = ctx.createPattern(g,'repeat');

  const v=document.createElement('canvas'); v.width=W; v.height=H;
  const vc=v.getContext('2d');
  const gr=vc.createRadialGradient(W/2,H/2,H*0.30,W/2,H/2,H*0.99);
  gr.addColorStop(0,'rgba(20,15,6,0)');
  gr.addColorStop(0.60,'rgba(20,15,6,0.10)');
  gr.addColorStop(1,'rgba(16,12,5,0.46)');
  vc.fillStyle=gr; vc.fillRect(0,0,W,H);
  VIG=v;
}
function paperBG(c,col){
  c.fillStyle = col||COL.paper;
  c.fillRect(-300,-300,W+600,H+600);
  if(GRAINP){
    c.save(); c.globalAlpha=0.55; c.globalCompositeOperation='multiply';
    c.fillStyle=GRAINP; c.fillRect(-300,-300,W+600,H+600); c.restore();
  }
}

/* ---------------- objects ---------------- */
function tape(c,x,y,w,h,rot,alpha){
  c.save(); c.translate(x,y); c.rotate(rot||0);
  c.globalAlpha = alpha===undefined?0.80:alpha;
  c.fillStyle='#e9d9a6';
  c.beginPath();
  c.moveTo(-w/2,-h/2);
  c.lineTo(w/2,-h/2+2); c.lineTo(w/2-3,h/2-3); c.lineTo(-w/2+2,h/2);
  c.closePath(); c.fill();
  c.globalAlpha=0.25; c.fillStyle='#fff';
  c.fillRect(-w/2+2,-h/2+2,w-6,h*0.28);
  c.restore();
}
function highlighter(c,x,y,w,h,p,col,rot){
  if(p<=0) return;
  c.save(); c.translate(x,y); c.rotate(rot||0);
  c.globalCompositeOperation='multiply';
  c.fillStyle = col||COL.yellow;
  c.globalAlpha=0.92;
  const ww = w*eo3(p);
  c.beginPath(); c.roundRect(0,0,ww,h,h*0.45); c.fill();
  c.globalAlpha=0.32;
  c.beginPath(); c.roundRect(2,h*0.55,Math.max(2,ww-4),h*0.3,h*0.2); c.fill();
  c.restore();
}
function stamp(c,x,y,label,size,col,rot,scale){
  c.save(); c.translate(x,y); c.rotate(rot||0); c.scale(scale||1,scale||1);
  c.globalAlpha=0.92;
  c.strokeStyle = col||COL.red; c.lineWidth=Math.max(4,size*0.09);
  const w = txtW(c,label,size,700,'Oswald',size*0.06)+size*0.8;
  const h = size*1.6;
  c.beginPath(); c.roundRect(-w/2,-h/2,w,h,6); c.stroke();
  c.lineWidth=Math.max(2,size*0.035);
  c.beginPath(); c.roundRect(-w/2+8,-h/2+8,w-16,h-16,4); c.stroke();
  txt(c,label,0,size*0.35,{size:size,weight:700,fam:'Oswald',col:col||COL.red,align:'center',ls:size*0.06});
  c.restore();
}

/* ---------------- media ---------------- */
const V = {}, IMG = {};
async function loadVideo(name,src){
  const v=document.createElement('video');
  v.src=src; v.muted=true; v.preload='auto'; v.playsInline=true; v.crossOrigin='anonymous';
  v.setAttribute('webkit-playsinline','');
  await new Promise((res,rej)=>{
    v.addEventListener('loadeddata',res,{once:true});
    v.addEventListener('canplaythrough',res,{once:true});
    v.addEventListener('error',()=>rej(new Error('video '+src)),{once:true});
    v.load();
  });
  V[name]=v; return v;
}
async function loadImg(name,src){
  const i=new Image(); i.src=src; await i.decode(); IMG[name]=i; return i;
}
function videoAt(v,lt){
  return new Promise(res=>{
    try{
      lt = Math.max(0, Math.min((v.duration||2)-0.06, lt));
      if(Math.abs(v.currentTime-lt) < 0.004 && v.readyState>=2) return res();
      let done=false;
      const fin=()=>{ if(!done){ done=true; setTimeout(res, 34); } };
      v.addEventListener('seeked',fin,{once:true});
      setTimeout(fin,6000);
      v.currentTime = lt;
    }catch(e){ res(); }
  });
}

/* staging canvas for video frames — no filters, no shadows */
const VOFF=document.createElement('canvas'); VOFF.width=1400; VOFF.height=900;
let VOFFG=VOFF.getContext('2d');

function applyGrade(c,x,y,w,h,g){
  if(!g) return;
  c.save();
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  if(g.desat){ c.globalCompositeOperation='saturation'; c.globalAlpha=g.desat; c.fillStyle='#808080'; c.fillRect(x,y,w,h); }
  if(g.mul){ c.globalCompositeOperation='multiply'; c.globalAlpha=g.mul; c.fillStyle='#9a9a9a'; c.fillRect(x,y,w,h); }
  if(g.warm){ c.globalCompositeOperation='multiply'; c.globalAlpha=g.warm; c.fillStyle='#f4e2c4'; c.fillRect(x,y,w,h); }
  if(g.contrast){ c.globalCompositeOperation='overlay'; c.globalAlpha=g.contrast; c.fillStyle='#161616'; c.fillRect(x,y,w,h); }
  if(g.bright){ c.globalCompositeOperation='screen'; c.globalAlpha=g.bright; c.fillStyle='#ffffff'; c.fillRect(x,y,w,h); }
  c.restore();
}
function drawCover(c,name,dx,dy,dw,dh,opt){
  opt=opt||{};
  const v=V[name];
  if(!v || !v.videoWidth || v.readyState<2) return;
  const m = opt.margin||0;
  const iw=v.videoWidth, ih=v.videoHeight;
  const sw0=iw*(1-2*m), sh0=ih*(1-2*m);
  let sx=iw*m, sy=ih*m, sw=sw0, sh=sh0;
  const z = opt.zoom||1;
  if(z>1){
    sw=sw0/z; sh=sh0/z;
    sx=iw*m+(sw0-sw)*(opt.zx===undefined?0.5:opt.zx);
    sy=ih*m+(sh0-sh)*(opt.zy===undefined?0.5:opt.zy);
  }
  const dA=dw/dh, sA=sw/sh;
  if(sA>dA){ const nw=sh*dA; sx+=(sw-nw)/2; sw=nw; }
  else { const nh=sw/dA; sy+=(sh-nh)/2; sh=nh; }

  const TW=Math.max(2,Math.round(sw)), TH=Math.max(2,Math.round(sh));
  if(VOFF.width<TW || VOFF.height<TH){
    VOFF.width=Math.max(VOFF.width,TW); VOFF.height=Math.max(VOFF.height,TH);
  }
  VOFFG.setTransform(1,0,0,1,0,0);
  VOFFG.globalAlpha=1; VOFFG.globalCompositeOperation='source-over';
  VOFFG.clearRect(0,0,VOFF.width,VOFF.height);
  try{ VOFFG.drawImage(v, sx,sy,sw,sh, 0,0,TW,TH); }catch(e){ return; }

  c.save();
  try{ c.drawImage(VOFF, 0,0,TW,TH, dx,dy,dw,dh); }catch(e){}
  c.restore();
  applyGrade(c,dx,dy,dw,dh,opt.grade);
}
function drawImgCover(c,img,dx,dy,dw,dh,opt){
  opt=opt||{};
  if(!img) return;
  const iw=img.width, ih=img.height, dA=dw/dh, sA=iw/ih;
  let sw=iw, sh=ih, sx=0, sy=0;
  if(sA>dA){ sw=ih*dA; sx=(iw-sw)/2; } else { sh=iw/dA; sy=(ih-sh)/2; }
  c.save();
  c.globalAlpha = opt.alpha===undefined?1:opt.alpha;
  c.drawImage(img, sx,sy,sw,sh, dx,dy,dw,dh);
  c.restore();
  applyGrade(c,dx,dy,dw,dh,opt.grade);
}
function scanlines(c,x,y,w,h,alpha,gap){
  c.save();
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.globalAlpha=alpha;
  c.fillStyle='rgba(6,10,8,0.55)';
  const g=gap||4;
  for(let yy=y; yy<y+h; yy+=g) c.fillRect(x,yy,w,1);
  c.restore();
}

/* ---------------- dust ---------------- */
const DUST = (()=>{ const r=mulberry32(9182); const a=[];
  for(let i=0;i<90;i++) a.push({x:r()*W, y:r()*H, s:0.35+r()*1.5, sz:0.7+r()*2.4, ph:r()*6.283});
  return a; })();
function drawDust(c,t,amt){
  if(amt<=0) return;
  c.save();
  for(const d of DUST){
    const y = ((d.y - 20*d.s*t) % (H+140) + H+140) % (H+140) - 70;
    const x = d.x + 10*Math.sin(t*0.45 + d.ph);
    const a = amt*(0.25+0.55*Math.abs(Math.sin(t*0.8+d.ph)));
    c.globalAlpha=a*0.8;
    c.fillStyle = 'rgba(92,78,54,1)';
    c.globalCompositeOperation='multiply';
    c.beginPath(); c.arc(x,y,d.sz,0,6.2832); c.fill();
    c.globalAlpha=a*0.45;
    c.fillStyle='rgba(255,252,240,1)';
    c.globalCompositeOperation='screen';
    c.beginPath(); c.arc(x-1.2,y-1.2,d.sz*0.75,0,6.2832); c.fill();
  }
  c.restore();
}

/* ============================================================
   SCENE 1 — THE WINDOW   0 → 6.6
   ============================================================ */
const CW = { x:845, y:470, w:1060, h:596 };
function drawS1(t, extraZoom){
  const c=G;
  const ez = extraZoom||1;
  c.save(); L(c,0.16);
  paperBG(c);
  c.strokeStyle='rgba(29,59,106,0.09)'; c.lineWidth=1;
  for(let x=-80;x<W+200;x+=80){ c.beginPath(); c.moveTo(x,-120); c.lineTo(x,H+120); c.stroke(); }
  for(let y=-80;y<H+200;y+=80){ c.beginPath(); c.moveTo(-120,y); c.lineTo(W+120,y); c.stroke(); }
  c.strokeStyle='rgba(29,59,106,0.15)'; c.lineWidth=2;
  c.beginPath(); c.arc(1660,780,290,0,6.2832); c.stroke();
  c.setLineDash([10,12]);
  c.beginPath(); c.arc(1660,780,252,0,6.2832); c.stroke();
  c.setLineDash([]);
  txt(c,'APOLLO 11 · LM-5',112,96,{size:28,fam:'IBM Plex Mono',col:'rgba(29,59,106,0.55)',ls:3});
  txt(c,'DESCENT / APPROACH PHASE',112,134,{size:28,fam:'IBM Plex Mono',col:'rgba(29,59,106,0.32)',ls:3});
  c.restore();

  c.save(); L(c,0.34);
  txt(c,'EAGLE',170,700,{size:280,weight:700,fam:'Oswald',col:'rgba(29,59,106,0.10)',ls:8});
  c.fillStyle='rgba(224,72,47,0.50)'; c.fillRect(176,728,214,9);
  c.restore();

  c.save(); L(c,0.5);
  c.translate(CW.x, CW.y);
  const pz = 1 + (ez-1)*0.95;
  c.scale(pz,pz);
  c.rotate(-1.15*Math.PI/180);

  const bwm=22, capH=62;
  const Wp=CW.w, Hp=CW.h+capH;
  c.save();
  c.shadowColor='rgba(26,20,10,0.44)'; c.shadowBlur=48; c.shadowOffsetY=26; c.shadowOffsetX=6;
  c.fillStyle=COL.cream;
  c.fillRect(-Wp/2-bwm, -Hp/2-bwm, Wp+2*bwm, Hp+2*bwm);
  c.restore();

  c.save();
  c.beginPath(); c.rect(-Wp/2,-Hp/2,Wp,CW.h); c.clip();
  drawCover(c,'descent',-Wp/2,-Hp/2,Wp,CW.h,{margin:0.04,zoom:1.32,zx:0.60,zy:0.46,
     grade:{desat:0.34, warm:0.22, contrast:0.14, bright:0.12}});
  c.globalCompositeOperation='multiply';
  c.fillStyle='rgba(234,218,188,0.24)'; c.fillRect(-Wp/2,-Hp/2,Wp,CW.h);
  c.globalCompositeOperation='source-over';
  const bx = -Wp/2 + Wp*0.44 + 22*Math.sin(t*1.15);
  const by = -Hp/2 + CW.h*0.50 + 14*Math.cos(t*0.9);
  c.strokeStyle='rgba(224,72,47,0.95)'; c.lineWidth=3;
  const bw2=258,bh2=178;
  c.beginPath();
  c.moveTo(bx-bw2/2,by-bh2/2); c.lineTo(bx-bw2/2+42,by-bh2/2);
  c.moveTo(bx+bw2/2-42,by-bh2/2); c.lineTo(bx+bw2/2,by-bh2/2);
  c.moveTo(bx+bw2/2,by-bh2/2); c.lineTo(bx+bw2/2,by-bh2/2+36);
  c.moveTo(bx+bw2/2,by+bh2/2-36); c.lineTo(bx+bw2/2,by+bh2/2);
  c.moveTo(bx+bw2/2,by+bh2/2); c.lineTo(bx+bw2/2-42,by+bh2/2);
  c.moveTo(bx-bw2/2+42,by+bh2/2); c.lineTo(bx-bw2/2,by+bh2/2);
  c.moveTo(bx-bw2/2,by+bh2/2); c.lineTo(bx-bw2/2,by+bh2/2-36);
  c.moveTo(bx-bw2/2,by-bh2/2+36); c.lineTo(bx-bw2/2,by-bh2/2);
  c.stroke();
  c.fillStyle='rgba(224,72,47,0.95)';
  c.fillRect(bx+bw2/2+10,by-17,164,34);
  txt(c,'TRACKING',bx+bw2/2+20,by+9,{size:28,weight:600,fam:'Inter',col:'#fbf8ef',ls:2});
  c.restore();

  c.fillStyle='rgba(46,42,36,0.5)';
  for(let i=0;i<12;i++) c.fillRect(-Wp/2+20+i*86, -Hp/2-bwm+6, 32, 9);

  txt(c,'PLATE 04 · 16 MM ONBOARD · 20 JULY 1969',
      -Wp/2+2, Hp/2-18, {size:28,fam:'IBM Plex Mono',weight:400,col:'#4b463b',ls:1});
  txt(c,'GET 102:41', Wp/2-2, Hp/2-18, {size:28,fam:'IBM Plex Mono',weight:600,col:COL.red,align:'right'});
  c.restore();

  c.save(); L(c,0.62);
  tape(c, CW.x-410, CW.y-306, 160, 44, -6*Math.PI/180);
  tape(c, CW.x+436, CW.y-298, 144, 42,  7*Math.PI/180);
  c.restore();

  c.save(); L(c,0.85);
  c.fillStyle=COL.red; c.fillRect(1400,206,6,300);
  txt(c,'THE MOON',1408,300,{size:70,weight:700,fam:'Oswald',col:COL.ink,ls:2});
  txt(c,'IS COMING',1408,344,{size:40,weight:600,fam:'Inter',col:COL.blue,ls:3});
  const hp = prog(t,2.15,2.65);
  highlighter(c,1404,258,286,58,hp,COL.yellow,-0.7*Math.PI/180);
  txt(c,'UP',1408,458,{size:112,weight:700,fam:'Oswald',col:COL.ink,ls:2});
  txt(c,'FAST',1408,574,{size:112,weight:700,fam:'Oswald',col:COL.ink,ls:2});
  const hp2 = prog(t,3.95,4.45);
  highlighter(c,1402,510,266,78,hp2,COL.yellow,0.6*Math.PI/180);

const OFF_A=document.createElement('canvas'); OFF_A.width=W; OFF_A.height=H;
const OFF_B=document.createElement('canvas'); OFF_B.width=W; OFF_B.height=H;
const OFF_C=document.createElement('canvas'); OFF_C.width=W; OFF_C.height=H;
function clearOff(o){ const g=o.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.globalCompositeOperation='source-over'; g.filter='none'; g.clearRect(0,0,W,H); return g; }

function pushBlend(t,u){
  let og=clearOff(OFF_A); G=og; drawS1(t, 1+1.55*Math.pow(u,1.55)); G=ctx;
  og=clearOff(OFF_B); G=og; drawS2(t); G=ctx;
  ctx.drawImage(OFF_A,0,0);
  const r = Math.max(2, Math.pow(u,1.7)*1800);
  ctx.save();
  ctx.beginPath(); ctx.arc(560,700,r,0,6.2832); ctx.clip();
  ctx.drawImage(OFF_B,0,0);
  ctx.restore();
  if(u<0.99 && r>26){
    ctx.save();
    ctx.globalAlpha=0.40*(1-u);
    ctx.strokeStyle='rgba(10,10,12,0.9)'; ctx.lineWidth=30;
    ctx.beginPath(); ctx.arc(560,700,r,0,6.2832); ctx.stroke();
    ctx.globalAlpha=0.28*(1-u);
    ctx.strokeStyle='rgba(246,196,67,0.9)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(560,700,Math.max(6,r-16),0,6.2832); ctx.stroke();
    ctx.restore();
  }
}

function textWindowBlend(t,u){

function zoomBlend(t,u){
  const c=ctx;

  drawS3(t);

  G=ctx;

function drawSubs(t){
  const list=window.NARRATION;
  let idx=-1;
  for(let i=0;i<list.length;i++) if(t>=list[i].t-0.15) idx=i;
  if(idx<0) return;
  const cur=list[idx], nxt=list[idx+1];
  const end = nxt ? nxt.t-0.25 : T.end-0.6;
  if(t>end+0.25) return;
  let a=1;
  if(t<cur.t+0.05) a=cl((t-(cur.t-0.15))/0.2);
  if(t>end-0.2) a=Math.min(a, cl((end-t)/0.2));
  if(a<=0.01) return;

  const c=ctx;
  const maxW=1400;
  c.save();
  c.font='600 38px Inter';
  const words=cur.text.split(/\s+/);
  const lines=[]; let line='';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(c.measureText(test).width > maxW && line){ lines.push(line); line=w; }
    else line=test;
  }
  if(line) lines.push(line);
  let widest=0;
  for(const l of lines) widest=Math.max(widest, c.measureText(l).width);
  c.restore();

  const lh=50, padX=34, padY=22;
  const bw=Math.min(maxW+80, widest+padX*2);
  const bh=lines.length*lh + padY*1.4;
  const x=W/2-bw/2, y=1012-bh;

  c.save();
  c.globalAlpha=a;
  c.fillStyle='rgba(14,13,11,0.72)';
  c.beginPath(); c.roundRect(x,y,bw,bh,14); c.fill();
  c.fillStyle='rgba(255,255,255,0.06)';
  c.beginPath(); c.roundRect(x+2,y+2,bw-4,bh-4,12); c.fill();
  for(let i=0;i<lines.length;i++){
    txt(c,lines[i],W/2, y+padY+38+i*lh,{size:38,weight:600,fam:'Inter',col:'#fbf8ef',align:'center'});
  }
  c.restore();
}

function frame(t){
  const c=ctx;
  CAM = camAt(t);
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1; c.globalCompositeOperation='source-over'; c.filter='none';
  c.fillStyle=COL.paper; c.fillRect(0,0,W,H);

  const u1=prog(t,T.p2-TRD,T.p2+TRD);
  const u2=prog(t,T.p3-TRD,T.p3+TRD);
  const u3=prog(t,T.p4-TRD,T.p4+TRD);
  const u4=prog(t,T.p5-TRD,T.p5+TRD);
  const u5=prog(t,T.p6-TRD,T.p6+TRD);

  if(t < T.p2+TRD){
    if(u1<=0.0001) drawS1(t,1); else pushBlend(t,u1);
  } else if(t < T.p3+TRD){
    if(u2<=0.0001) drawS2(t); else textWindowBlend(t,u2);
  } else if(t < T.p4+TRD){
    if(u3<=0.0001) drawS3(t); else zoomBlend(t,u3);
  } else if(t < T.p5+TRD){
    if(u4<=0.0001) drawS4(t); else wipeBlend(t,u4);
  } else if(t < T.p7){
    if(u5<=0.0001) drawS5(t); else tearBlend(t,u5);
  } else {
    drawTable(t);
  }

  drawBloom(t);
  drawSubs(t);

  c.save();
  if(VIG){ c.globalAlpha=0.85; c.drawImage(VIG,0,0); }
  if(GRAINP){
    c.globalAlpha=0.13; c.globalCompositeOperation='overlay';
    c.fillStyle=GRAINP; c.fillRect(0,0,W,H);
  }
  c.restore();
}

function prepList(t){
  const jobs=[];
  const add=(n,lt)=>{ if(V[n]) jobs.push(videoAt(V[n],lt)); };
  if(t < T.p2+TRD) add('descent', 2.4 + t*0.55);
  if(t >= T.p6-TRD && t < T.p7+TRD) add('descent', descentTime2(t));
  if(t >= T.p5-TRD && t < T.p6+TRD){ add('controller', controllerTime(t)); add('mocr', mocrTime(t)); }
  if(t >= T.p7-TRD){ add('tvflag', tvTime(t)); add('lm_space', lmTime(t)); }
  return jobs;
}
window.seek = async function(t){
  t = cl(t,0,T.end);
  const jobs = prepList(t);
  if(jobs.length) await Promise.all(jobs);
  frame(t);
};

function wavFromBuffer(buf){
  const nch=buf.numberOfChannels, len=buf.length, sr=buf.sampleRate;
  const bytes = 44 + len*nch*2;
  const ab = new ArrayBuffer(bytes);
  const view = new DataView(ab);
  const wr=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); view.setUint32(4,bytes-8,true); wr(8,'WAVE');
  wr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,nch,true); view.setUint32(24,sr,true);
  view.setUint32(28,sr*nch*2,true); view.setUint16(32,nch*2,true); view.setUint16(34,16,true);
  wr(36,'data'); view.setUint32(40,len*nch*2,true);
  const chans=[]; for(let i=0;i<nch;i++) chans.push(buf.getChannelData(i));
  let o=44;
  for(let i=0;i<len;i++){
    for(let ch=0;ch<nch;ch++){
      let s=Math.max(-1,Math.min(1,chans[ch][i]));
      view.setInt16(o, s<0 ? s*0x8000 : s*0x7FFF, true); o+=2;
    }
  }
  const u8=new Uint8Array(ab);
  let str='';
  const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) str += String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(str);
}
function makeIR(ac, secs, decay){
  const len=Math.floor(ac.sampleRate*secs);
  const buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    const r=mulberry32(1000+ch*77);
    for(let i=0;i<len;i++){
      const x=i/len;
      d[i]=(r()*2-1)*Math.pow(1-x,decay);
    }
  }
  return buf;
}

  music.gain.linearRampToValueAtTime(baseM, 2.4);
  for(const e of events){
    music.gain.setTargetAtTime(baseM*0.30, Math.max(0.05,e[0]-0.18), 0.06);
    music.gain.setTargetAtTime(baseM, e[1]+0.02, 0.13);
  }
  music.gain.setTargetAtTime(baseM*0.55, T.end-2.0, 0.4);
  sfx.gain.setValueAtTime(1.0,0);
  for(const e of events){
    sfx.gain.setTargetAtTime(0.50, Math.max(0.05,e[0]-0.18), 0.06);
    sfx.gain.setTargetAtTime(1.0, e[1]+0.02, 0.13);
  }

  const rendered = await ac.startRendering();
  return wavFromBuffer(rendered);
};
