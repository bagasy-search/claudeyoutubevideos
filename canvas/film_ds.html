<!DOCTYPE html>

  html,body{margin:0;padding:0;height:100%;background:#0b0814;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:#1c1030;
         box-shadow:0 0 80px rgba(0,0,0,.75);}

<body>
<div id="wrap"><canvas id="rfCanvas" width="1080" height="1920"></canvas></div>
<script>
(function(){
'use strict';

/* ============================================================
   RF — ROYAL FILM.  One canvas.  Every frame = f(t).
   ============================================================ */

var W = 1080, H = 1920;
var cv  = document.getElementById('rfCanvas');
var ctx = cv.getContext('2d');

window.READY = false;
window.END   = 41.8;

var OUT = '#2a1b3d';

/* ---------- math ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function inv(a,b,v){ return clamp((v-a)/(b-a),0,1); }
function easeOut(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function easeInOut(t){ t=clamp(t,0,1); return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function easeIn(t){ t=clamp(t,0,1); return t*t*t; }
function easeOutBack(t,s){ t=clamp(t,0,1); s=s===undefined?1.7:s;
  return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2); }
function hash(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }

/* squash arrival: (0.72, 1.12, 0.95, 1) over 0.3 s */
function squashY(k){
  if(k===undefined) return 1;
  if(k>=1) return 1;
  if(k<=0) return 0.72;
  var keys=[0,0.30,0.62,0.85,1], vals=[0.72,1.12,0.95,1.02,1];
  for(var i=0;i<keys.length-1;i++){
    if(k<=keys[i+1]){
      var f=(k-keys[i])/(keys[i+1]-keys[i]);
      return lerp(vals[i],vals[i+1],f);
    }
  }
  return 1;
}
function squashX(sy){ return 1+(1-sy)*0.70; }

/* ---------- colour ---------- */
function dark(hex,f){
  var n=parseInt(hex.slice(1),16);
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f)); g=Math.min(255,Math.round(g*f)); b=Math.min(255,Math.round(b*f));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------- shapes ---------- */
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* rounded block with 8 px outline + one flat darker shade on the right */
function block(x,y,w,h,r,fill,shade,shadeFrac){
  rr(x,y,w,h,r);
  ctx.fillStyle=fill; ctx.fill();
  if(shade){
    ctx.save(); ctx.clip();
    var sw = shadeFrac===undefined ? Math.max(10, Math.abs(w)*0.26) : Math.abs(w)*shadeFrac;
    ctx.fillStyle=shade;
    ctx.fillRect(x+w-sw, y-2, sw+4, h+4);
    ctx.restore();
  }
  ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.lineJoin='round'; ctx.stroke();
}

function txt(s,x,y,size,col,align,lw,shadow){
  ctx.font = size+'px "Lilita One", "Arial Black", Impact, sans-serif';
  ctx.textAlign = align||'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin='round'; ctx.miterLimit=2;
  if(shadow){
    ctx.shadowColor='rgba(8,3,20,.55)'; ctx.shadowBlur=20; ctx.shadowOffsetY=10;
  }
  if(lw){
    ctx.lineWidth=lw; ctx.strokeStyle=OUT; ctx.strokeText(s,x,y);
  }
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}

function star5(cx,cy,r1,r2,points,fill,stroke){
  ctx.beginPath();
  for(var i=0;i<points*2;i++){
    var a = -Math.PI/2 + i*Math.PI/points;
    var r = i%2===0?r1:r2;
    var px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth=7; ctx.strokeStyle=stroke; ctx.lineJoin='round'; ctx.stroke(); }
}

function spiral(cx,cy,r){
  ctx.beginPath();
  for(var i=0;i<=64;i++){
    var a=i/64*Math.PI*4.2;
    var rad=r*(i/64);
    var px=cx+Math.cos(a)*rad, py=cy+Math.sin(a)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.lineCap='round'; ctx.stroke();
}

function poof(x,y,t,life,scale){
  if(t<0||t>life) return;
  var g = t/life;
  ctx.save();
  ctx.globalAlpha = (1-g)*0.95;
  for(var i=0;i<10;i++){
    var a = (i/10)*Math.PI*2 + 0.42;
    var d = (16 + 86*g) * scale;
    var r = (26*(1-g)+9) * scale * (0.6+0.8*hash(i*3.31));
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*d, y+Math.sin(a)*d*0.72, r, 0, 7);
    ctx.fillStyle='#ffffff'; ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   RIG
   ============================================================ */

var HAND_LEN = 151;

function handPos(px,py,ang,side){
  var th = -ang*side;
  return { x: px + (-Math.sin(th))*HAND_LEN, y: py + Math.cos(th)*HAND_LEN };
}

function drawBrow(cx,cy,type,side,col){
  if(!type||type==='none') return;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.lineCap='round';
  var a=0, yo=0;
  if(type==='up'){ a = 0.13*side; yo=-7; }
  else if(type==='worry'){ a = 0.44*side; yo=0; }
  else if(type==='angry'){ a = -0.50*side; yo=4; }
  else { a=0; yo=0; }
  ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(-30,yo); ctx.lineTo(30,yo);
  ctx.lineWidth=16; ctx.strokeStyle=col||OUT; ctx.stroke();
  ctx.restore();
}

function drawEye(cx,cy,type,closed,lx,ly){
  if(closed||type==='closed'){
    ctx.beginPath(); ctx.moveTo(cx-22,cy); ctx.lineTo(cx+22,cy);
    ctx.lineWidth=10; ctx.strokeStyle=OUT; ctx.lineCap='round'; ctx.stroke();
    return;
  }
  ctx.save();
  ctx.translate(cx,cy);
  switch(type){
    case 'happy':
      ctx.beginPath(); ctx.arc(0,7,21,Math.PI*1.08,Math.PI*1.92);
      ctx.lineWidth=12; ctx.strokeStyle=OUT; ctx.lineCap='round'; ctx.stroke();
      break;
    case 'huge':
      ctx.beginPath(); ctx.ellipse(0,0,32,35,0,0,7);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.beginPath(); ctx.arc(lx*9,ly*9,15,0,7); ctx.fillStyle=OUT; ctx.fill();
      break;
    case 'star':
      star5(0,0,30,13,5,'#ffd23f',OUT);
      break;
    case 'spiral':
      spiral(0,0,26);
      break;
    case 'narrow':
      ctx.beginPath(); ctx.ellipse(0,5,24,13,0,0,7);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.beginPath(); ctx.arc(lx*6,5,8,0,7); ctx.fillStyle=OUT; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-24,-3); ctx.lineTo(24,-3);
      ctx.lineWidth=10; ctx.strokeStyle=OUT; ctx.stroke();
      break;
    default:
      ctx.beginPath(); ctx.ellipse(0,0,24,27,0,0,7);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.beginPath(); ctx.arc(lx*10,ly*10,12,0,7); ctx.fillStyle=OUT; ctx.fill();
  }
  ctx.restore();
}

function drawMouth(cx,cy,type,t){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.lineJoin='round'; ctx.lineCap='round';
  switch(type){
    case 'flat':
      ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(34,0);
      ctx.lineWidth=10; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'grin':
      ctx.beginPath(); ctx.moveTo(-46,-10); ctx.quadraticCurveTo(0,54,46,-10); ctx.closePath();
      ctx.fillStyle='#7a2436'; ctx.fill();
      ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.save(); ctx.clip(); ctx.fillStyle='#ffffff'; ctx.fillRect(-50,-16,100,24); ctx.restore();
      break;
    case 'wide':
      ctx.beginPath(); ctx.ellipse(0,8,50,40,0,0,7);
      ctx.fillStyle='#7a2436'; ctx.fill();
      ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.save(); ctx.clip(); ctx.fillStyle='#ffffff'; ctx.fillRect(-54,-32,108,26); ctx.restore();
      break;
    case 'o':
      ctx.beginPath(); ctx.ellipse(0,4,25,31,0,0,7);
      ctx.fillStyle='#7a2436'; ctx.fill();
      ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'scream':
      ctx.beginPath(); ctx.ellipse(0,12,44,54,0,0,7);
      ctx.fillStyle='#7a2436'; ctx.fill();
      ctx.lineWidth=9; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,46,24,13,0,0,7);
      ctx.fillStyle='#ff5165'; ctx.fill();
      ctx.lineWidth=6; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'wavy':
      ctx.beginPath();
      ctx.moveTo(-44,4);
      ctx.bezierCurveTo(-26,-16,-10,22,6,2);
      ctx.bezierCurveTo(20,-14,34,16,46,-2);
      ctx.lineWidth=11; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'smirk':
      ctx.beginPath(); ctx.moveTo(-36,8); ctx.quadraticCurveTo(6,26,42,-8);
      ctx.lineWidth=11; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'tongue':
      ctx.beginPath(); ctx.arc(0,-8,34,0.18*Math.PI,0.82*Math.PI);
      ctx.lineWidth=10; ctx.strokeStyle=OUT; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(12,26,19,13,0.2,0,7);
      ctx.fillStyle='#ff7ad9'; ctx.fill();
      ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke(); break;
    case 'chew':
      var k = Math.sin(t*17)*0.5+0.5;
      ctx.beginPath(); ctx.ellipse(0,0,22,9+k*11,0,0,7);
      ctx.fillStyle='#7a2436'; ctx.fill();
      ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.stroke(); break;
    default: /* smile */
      ctx.beginPath(); ctx.arc(0,-10,36,0.18*Math.PI,0.82*Math.PI);
      ctx.lineWidth=11; ctx.strokeStyle=OUT; ctx.stroke();
  }
  ctx.restore();
}

function drawSweat(hx,hy,k,side){
  if(!k||k<=0) return;
  var bob = Math.sin(k*9)*6;
  ctx.save();
  ctx.globalAlpha = clamp(k,0,1);
  ctx.translate(hx + (side||1)*118, hy-40+bob);
  ctx.beginPath();
  ctx.moveTo(0,-30);
  ctx.bezierCurveTo(18,-6,22,10,0,22);
  ctx.bezierCurveTo(-22,10,-18,-6,0,-30);
  ctx.fillStyle='#7debff'; ctx.fill();
  ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke();
  ctx.restore();
}

function drawFace(o,hx,hy){
  var t  = o.t||0;
  var bt = ((t + (o.blinkOff||0)) % 1.6);
  var blinking = (o.blink!==false) && bt < 0.1;

  var ex = 48, ey = hy+26;
  var LX = hx-ex, RX = hx+ex;
  var lx = o.look?o.look.x:0, ly = o.look?o.look.y:0;

  if(o.blush){
    ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle='#ff7ad9';
    ctx.beginPath(); ctx.ellipse(hx-86,hy+52,26,15,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx+86,hy+52,26,15,0,0,7); ctx.fill();
    ctx.restore();
  }

  drawBrow(LX,hy-20,o.brows,-1);
  drawBrow(RX,hy-20,o.brows,+1);

  drawEye(LX,ey,o.eyes,blinking,lx,ly);
  drawEye(RX,ey,o.eyes,blinking,lx,ly);

  drawMouth(hx,hy+72,o.mouth,t);

  if(o.sweat>0){
    drawSweat(hx,hy,o.sweat*1, 1);
    if(o.sweat>0.5) drawSweat(hx,hy,o.sweat*0.8,-1);
  }
}

function drawHead(o,hx,hy){
  var skin=o.skin, dskin=dark(skin,0.87);
  var hair=o.hair, dhair=dark(hair,0.85);

  if(o.kind==='mom'){
    block(hx-128,hy-122,256,240,66,hair,dhair);
  }
  if(o.kind==='bro'){
    block(hx-136,hy-126,272,254,80,o.hood,dark(o.hood,0.82));
  }

  block(hx-108,hy-100,216,200,56,skin,dskin);

  if(o.kind==='you'){
    block(hx-116,hy-104,232,62,40,hair,dhair);
    block(hx-120,hy-142,240,88,46,o.cap,dark(o.cap,0.80));
    block(hx-34,hy-142,68,32,14,'#1c1030',null);
  } else if(o.kind==='mom'){
    block(hx-112,hy-108,224,74,38,hair,dhair);
    ctx.save();
    ctx.translate(hx+150,hy-42); ctx.rotate(0.5);
    block(-42,-36,84,158,42,hair,dhair);
    ctx.restore();
    block(hx+96,hy-72,58,32,15,'#ff5165',null);
  } else if(o.kind==='bro'){
    block(hx-118,hy-118,236,58,30,o.hood,dark(o.hood,0.82));
  }

  drawFace(o,hx,hy);

  if(o.glasses){
    ctx.save();
    ctx.lineWidth=8; ctx.strokeStyle=OUT; ctx.fillStyle='rgba(190,235,255,0.25)';
    [-48,48].forEach(function(dx){
      ctx.beginPath(); ctx.arc(hx+dx,hy+26,34,0,7); ctx.fill(); ctx.stroke();
    });
    ctx.beginPath(); ctx.moveTo(hx-14,hy+26); ctx.lineTo(hx+14,hy+26); ctx.stroke();
    ctx.restore();
  }
  if(o.hoop){
    ctx.save(); ctx.lineWidth=7; ctx.strokeStyle=o.hoop;
    [-114,114].forEach(function(dx){
      ctx.beginPath(); ctx.arc(hx+dx,hy+72,15,0,7); ctx.stroke();
    });
    ctx.restore();
  }
  if(o.shades>0){
    var k = o.shades;
    var drop = (1-clamp(k,0,1))*-300;
    var sq = k>=1?1:squashY(clamp(k,0,1));
    ctx.save();
    ctx.translate(hx,hy+26+drop);
    ctx.scale(1, sq);
    block(-98,-32,86,62,24,'#1c1030',null);
    block(12,-32,86,62,24,'#1c1030',null);
    ctx.beginPath(); ctx.moveTo(-14,-8); ctx.lineTo(14,-8);
    ctx.lineWidth=16; ctx.strokeStyle='#1c1030'; ctx.lineCap='round'; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.fillRect(-88,-26,22,16);
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.fillRect(24,-26,22,16);
    ctx.restore();
  }
}

function drawLeg(px,py,ang,w,h,col,dcol,shoeCol){
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(ang||0);
  block(-w/2,0,w,h,18,col,dcol);
  block(-42,h,84,42,16,shoeCol,dark(shoeCol,0.78));
  ctx.restore();
}

function drawArm(px,py,ang,side,skin,dskin){
  var th = -ang*side;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(th);
  block(-31,0,62,132,22,skin,dskin);
  block(-28,128,56,46,18,skin,dskin);
  ctx.restore();
}

function drawChar(o){
  var s  = o.s===undefined?1:o.s;
  var sx = o.sx===undefined?1:o.sx;
  var sy = o.sy===undefined?1:o.sy;
  var skin=o.skin, dskin=dark(skin,0.87);
  var shirt=o.shirt, dsh=dark(shirt,0.80);
  var pants=o.pants, dp=dark(pants,0.80);
  var shoe=o.shoe||'#2a1b3d';

  ctx.save();
  ctx.translate(o.x,o.y);
  if(o.rot) ctx.rotate(o.rot);
  ctx.scale(s*sx, s*sy);

  drawLeg(-37,-184, o.legL||0, 72,142, pants,dp, shoe);
  drawLeg( 37,-184, o.legR||0, 72,142, pants,dp, shoe);

  block(-76,-338,152,154,26,shirt,dsh);

  drawArm(-107,-326, o.armL||0, -1, skin,dskin);
  drawArm( 107,-326, o.armR||0, +1, skin,dskin);

  ctx.save();
  ctx.translate(0,-338);
  ctx.rotate(o.tilt||0);
  ctx.translate(0,338);
  drawHead(o,0,-438);
  ctx.restore();

  ctx.restore();
}

/* character presets */
var CH = {
  you: {skin:'#ffc99a',shirt:'#ffc934',pants:'#3f66cf',shoe:'#2a1b3d',hair:'#f27b2c',cap:'#2e88ee',kind:'you'},
  mom: {skin:'#ffcf9e',shirt:'#2bb3a3',pants:'#6b3fa0',shoe:'#3a2a5a',hair:'#a63e28',kind:'mom',glasses:true,hoop:'#ffd23f'},
  bro: {skin:'#f5bd8e',shirt:'#5dff8f',pants:'#8a93b5',shoe:'#2a1b3d',hair:'#3b2a1a',kind:'bro',hood:'#3ecf6f'}
};
function P(base,over){
  var o={},k;
  for(k in base) o[k]=base[k];
  if(over) for(k in over) o[k]=over[k];
  return o;
}

/* ============================================================
   SETS
   ============================================================ */

function setBedroom(){
  ctx.fillStyle='#9fdcff'; ctx.fillRect(-400,-400,1880,1900);
  ctx.fillStyle='#8bd0f8';
  for(var i=0;i<9;i++) ctx.fillRect(-400+i*230,-400,120,1900);
  ctx.fillStyle='#ffd3a8'; ctx.fillRect(-400,1420,1880,900);
  ctx.save(); ctx.globalAlpha=0.14; ctx.fillStyle='#7a4a2a';
  for(var j=0;j<13;j++) ctx.fillRect(-400+j*160,1420,8,900);
  ctx.restore();
  block(-400,1372,1880,52,0,'#ffe9d2','#e2c6a8');

  /* window */
  block(760,470,320,280,26,'#cdf3ff','#a9e0f5');
  ctx.save();
  ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(880,570,48,0,7); ctx.fill();
  ctx.fillStyle='#8ed7ff'; ctx.fillRect(900,620,160,110);
  ctx.fillStyle='#ffffff'; ctx.fillRect(918,600,100,34);
  ctx.fillRect(940,586,56,34);
  ctx.fillStyle='#bfeaff'; ctx.fillRect(920,690,80,60);
  ctx.restore();

  /* poster */
  block(140,460,220,260,22,'#ffffff','#dcd6ea');
  block(182,516,134,124,34,'#ffc99a','#e8b184');
  block(178,500,142,44,20,'#2e88ee','#256fbe');
  ctx.fillStyle=OUT;
  ctx.beginPath(); ctx.arc(222,566,11,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(276,566,11,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(232,600); ctx.quadraticCurveTo(249,616,266,600);
  ctx.lineWidth=7; ctx.strokeStyle=OUT; ctx.stroke();

  /* rug */
  ctx.save(); ctx.globalAlpha=0.92;
  ctx.fillStyle='#7debff';
  ctx.beginPath(); ctx.ellipse(420,1610,330,112,0,0,7); ctx.fill();
  ctx.fillStyle='#5fd0e8';
  ctx.beginPath(); ctx.ellipse(420,1610,250,80,0,0,7); ctx.fill();
  ctx.restore();

  /* desk */
  block(830,1080,300,40,14,'#c98a5a','#a06a40');
  block(858,1120,34,320,10,'#a06a40','#7d5028');
  block(1062,1120,34,320,10,'#a06a40','#7d5028');
}

function setKitchen(){
  ctx.fillStyle='#ffe1ec'; ctx.fillRect(-400,-400,1880,1900);
  ctx.fillStyle='#ffd0e0';
  for(var i=0;i<9;i++) ctx.fillRect(-400+i*220,-400,110,1900);
  ctx.fillStyle='#ffd9b0'; ctx.fillRect(-400,1420,1880,900);
  block(-400,1372,1880,52,0,'#fff0dc','#e8cfae');

  block(-400,1120,1880,74,16,'#ffffff','#d8cfe2');
  block(-400,1194,1880,240,0,'#7fd9c8','#5bb8a8');
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#ffffff';
  for(var k=0;k<8;k++) ctx.fillRect(-340+k*180,1224,90,180);
  ctx.restore();

  /* cupboard */
  block(760,470,340,420,22,'#ffb0c8','#e090a8');
  block(800,510,260,160,14,'#ffd6e4','#e8b0c0');

function confettiBurst(t,t0,life,n,seed){

    var a = hash(seed+i*7.1)*Math.PI*2;
    var sp = 260 + hash(seed+i*3.7)*640;
    var px = 540 + Math.cos(a)*sp*easeOut(k);
    var py = 500 + Math.sin(a)*sp*easeOut(k) + 900*k*k;
    var sz = 14+hash(seed+i*5.3)*22;
    ctx.save();
    ctx.globalAlpha = 1-k;
    ctx.translate(px,py);
    ctx.rotate(k*9+i);
    ctx.fillStyle = ['#ff5165','#5dff8f','#ffd23f','#ff7ad9','#7debff','#ffa53d','#c49bff'][i%7];
    ctx.fillRect(-sz/2,-sz/2,sz,sz*0.66);
    ctx.restore();
  }
}

var HITS = [
  {t:1.55,a:16},{t:2.30,a:20},{t:3.40,a:22},{t:4.50,a:14},
  {t:7.55,a:22},{t:8.45,a:26},{t:10.0,a:12},{t:11.10,a:16},
  {t:13.40,a:18},{t:15.65,a:14},{t:16.75,a:20},{t:18.85,a:22},
  {t:20.50,a:20},{t:21.30,a:26},{t:22.35,a:18},{t:23.50,a:22},
  {t:24.90,a:20},{t:25.75,a:20},{t:26.60,a:22},{t:27.45,a:24},
  {t:30.30,a:22},{t:33.00,a:24},{t:36.90,a:30},{t:38.60,a:26},
  {t:40.30,a:24}
];

function shakeAt(t){
  var x=0,y=0;
  for(var i=0;i<HITS.length;i++){
    var h=HITS[i], d=t-h.t;
    if(d>=0 && d<0.35){
      var k=1-d/0.35, a=h.a*k*k;
      x += Math.sin(d*118 + h.t*7.3)*a;
      y += Math.cos(d*101 + h.t*5.1)*a;
    }
  }
  return {x:x,y:y};
}

  }

}

function drawCaptions(t){
  var c = capAt(t); if(!c) return;
  var age = t - c.t0;
  var k = clamp(age/0.16, 0, 1);
  var sc = 0.55 + 0.45*easeOutBack(k, 1.55);

  ctx.save();
  ctx.translate(540, 1290);
  ctx.scale(sc,sc);
  ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.lineJoin='round';

  var fs = 124;
  ctx.font = fs+'px "Lilita One", "Arial Black", Impact, sans-serif';
  var gap = 30;
  var ws = [], i, total = 0;
  for(i=0;i<c.w.length;i++){ ws.push(ctx.measureText(c.w[i][0]).width); total += ws[i]; }
  total += gap*(c.w.length-1);

  if(total > 980){
    fs = Math.floor(124*980/total);
    ctx.font = fs+'px "Lilita One", "Arial Black", Impact, sans-serif';
    ws = []; total = 0;
    for(i=0;i<c.w.length;i++){ ws.push(ctx.measureText(c.w[i][0]).width); total += ws[i]; }
    total += gap*(c.w.length-1);
  }

  var x = -total/2;
  ctx.shadowColor='rgba(10,4,25,.55)'; ctx.shadowBlur=22; ctx.shadowOffsetY=10;
  for(i=0;i<c.w.length;i++){
    var cx = x + ws[i]/2;

    ctx.strokeText(c.w[i][0], cx, 0);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

    ctx.fillText(c.w[i][0], cx, 0);
    ctx.shadowColor='rgba(10,4,25,.55)'; ctx.shadowBlur=22; ctx.shadowOffsetY=10;
    x += ws[i] + gap;
  }
  ctx.restore();
}

/* ============================================================
   REWIND FX
   ============================================================ */

function drawRewindFX(p){
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#0b0814';
  for(var y=0;y<1920;y+=9) ctx.fillRect(0,y,1080,3);
  ctx.restore();

  ctx.save();
  var off = (p*900)%60;
  for(var i=0;i<10;i++){
    ctx.globalAlpha = 0.22*(1-p);
    ctx.fillStyle = i%2 ? '#7debff' : '#ff5165';
    ctx.fillRect(0, ((i*260)+off)%2100-120, 1080, 12);
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp(p*5,0,1);
  rr(660,150,320,110,26);
  ctx.fillStyle='rgba(18,10,34,0.95)'; ctx.fill();
  ctx.lineWidth=8; ctx.strokeStyle='#ff5165'; ctx.stroke();
  txt('REWIND', 820, 208, 62, '#ff5165', 'center', 14);
  ctx.restore();
}

/* ============================================================
   RENDER
   ============================================================ */

function shotAt(t){
  for(var i=SHOTS.length-1;i>=0;i--){
    if(t >= SHOTS[i].t0){ return SHOTS[i]; }
  }
  return SHOTS[0];
}

function drawScene(t){
  var shot = shotAt(t);
  var p = (t - shot.t0) / Math.max(0.0001,(shot.t1 - shot.t0));
  var lp = t - shot.t0;

  var sh = shakeAt(t);

  ctx.save();
  ctx.translate(sh.x, sh.y);
  var cm = shot.cam(lp,p);
  ctx.translate(W/2, H/2);
  ctx.scale(cm.zoom, cm.zoom);
  ctx.translate(-cm.cx, -cm.cy);
  shot.world(lp,p,t);
  ctx.restore();

  if(shot.ui){
    ctx.save();
    shot.ui(lp,p,t);
    ctx.restore();
  }
}

function render(tin){
  var t = clamp(tin, 0, window.END - 0.0001);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);

  var shot = shotAt(t);

  if(shot.rewind){
    var p = (t - shot.t0)/(shot.t1 - shot.t0);
    var back = lerp(41.20, 0.00, easeInOut(p));
    drawScene(back);
    drawRewindFX(p);
  } else {
    drawScene(t);
  }

  ctx.setTransform(1,0,0,1,0,0);
  drawCaptions(t);
}

window.seek = function(t){ RF_EXTERNAL = true; render(t); return true; };

/* ============================================================
   BOOT
   ============================================================ */

var RF_EXTERNAL = false;
var RF_T0 = 0;
var RF_STARTED = false;

function rfLoop(){
  if(!RF_EXTERNAL && RF_STARTED){
    var el = (performance.now() - RF_T0)/1000;
    var t = el % (window.END + 0.35);
    if(t > window.END) t = window.END - 0.0001;
    render(t);
  }
  requestAnimationFrame(rfLoop);
}

function rfBoot(){
  render(0);
  RF_T0 = performance.now();
  RF_STARTED = true;
  requestAnimationFrame(rfLoop);

  /* font must be ready before READY flips */
  Promise.all([
    document.fonts.load('124px "Lilita One"'),
    document.fonts.load('230px "Lilita One"'),
    document.fonts.load('40px "Lilita One"')
  ]).catch(function(){}).then(function(){
    window.READY = true;
    render(0);
  });
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ window.READY = true; render(0); });
}

window.addEventListener('load', rfBoot);
if(document.readyState === 'complete') rfBoot();

})();
