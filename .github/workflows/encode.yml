# Codificación de ENTREGA en paralelo para videos Remotion (rama encode-<slug>): cada runner baja el crudo del farm
# (artefacto final-<slug> de la corrida RUN), recodifica SU tramo de cuadros con los filtros de entrega.sh
# (PTS rehechos, bt470bg→bt709, yuv420p tv, x264 crf20 g60 bf0), y "unir" concatena sin recodificar + mezcla → release <slug>.
name: encode-entrega
on:
  push:
    branches: ['encode-*']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 -c "import json;print(json.dumps([c['k'] for c in json.load(open('chunks.json'))['tramos']]))")" >> "$GITHUB_OUTPUT"
  tramo:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        k: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        timeout-minutes: 6
        run: |
          which ffmpeg && exit 0
          for n in 1 2 3; do curl -sfL --max-time 120 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break; sleep 5; done
          mkdir -p ffb && tar -xJf ff.tar.xz -C ffb --strip-components=1 && echo "$PWD/ffb/bin" >> "$GITHUB_PATH"
      - name: bajar crudo
        run: |
          SLUG="${GITHUB_REF_NAME#encode-}"; echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          RUN=$(python3 -c "import json;print(json.load(open('chunks.json'))['run'])")
          for n in 1 2 3 4; do gh run download $RUN -n final-$SLUG -D raw -R ${{ github.repository }} && break; sleep $((n*10)); done
          ls -la raw
      - name: codificar tramo
        run: |
          read A F <<< $(python3 -c "import json;c=[x for x in json.load(open('chunks.json'))['tramos'] if x['k']==${{ matrix.k }}][0];print(c['a'],c['f'])")
          B=$((A+F-1)); IN=$(ls raw/*.mp4 | head -1)
          ffmpeg -v error -y -i "$IN" -an \
            -vf "setpts=N/(30*TB),select='between(n\,$A\,$B)',setpts=N/(30*TB),scale=in_range=full:out_range=limited:in_color_matrix=bt470bg:out_color_matrix=bt709,format=yuv420p" \
            -fps_mode passthrough -frames:v $F -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:v libx264 -preset faster -crf 20 -bf 0 -maxrate 8M -bufsize 12M -g 60 -keyint_min 60 -sc_threshold 0 tramo_${{ matrix.k }}.mp4
          ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 tramo_${{ matrix.k }}.mp4
          for n in 1 2 3 4 5; do gh release upload "$SLUG" tramo_${{ matrix.k }}.mp4 -R ${{ github.repository }} --clobber && break; sleep $((n*7)); done
  unir:
    needs: tramo
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        timeout-minutes: 6
        run: |
          which ffmpeg && exit 0
          for n in 1 2 3; do curl -sfL --max-time 120 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break; sleep 5; done
          mkdir -p ffb && tar -xJf ff.tar.xz -C ffb --strip-components=1 && echo "$PWD/ffb/bin" >> "$GITHUB_PATH"
      - name: unir + mezcla + subir
        run: |
          SLUG="${GITHUB_REF_NAME#encode-}"
          N=$(python3 -c "import json;print(len(json.load(open('chunks.json'))['tramos']))")
          TOT=$(python3 -c "import json;print(json.load(open('chunks.json'))['total'])")
          : > list.txt
          for k in $(seq 0 $((N-1))); do curl -sfL -o tramo_$k.mp4 "https://github.com/${{ github.repository }}/releases/download/$SLUG/tramo_$k.mp4"; echo "file 'tramo_$k.mp4'" >> list.txt; done
          curl -sfL -o mezcla.wav "https://github.com/${{ github.repository }}/releases/download/$SLUG/mezcla.wav"
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -i mezcla.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -t $(python3 -c "print($TOT/30)") -movflags +faststart $SLUG.mp4
          C=$(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 $SLUG.mp4); echo "cuadros $C / $TOT"
          test "$C" = "$TOT" || { echo "⛔ cuadros != TOTAL"; exit 1; }
          gh release view "$SLUG" -R ${{ github.repository }} >/dev/null 2>&1 || gh release create "$SLUG" -R ${{ github.repository }} --title "$SLUG" --notes "$SLUG"
          for n in 1 2 3 4 5; do gh release upload "$SLUG" $SLUG.mp4 -R ${{ github.repository }} --clobber && break; sleep $((n*10)); done
