# Render distribuido GRATIS en GitHub Actions (repo PÚBLICO = minutos ilimitados).
# Parte el video en N rangos de frames, los renderiza en paralelo (matrix), y une con ffmpeg.
# MEJORAS (Bagasy): caché de deps+chromium (npm ci vuela), barra de progreso por chunk a Supabase,
# chunks persistidos + input only_chunks para RE-RENDER PARCIAL (solo los pedazos que cambiaron).
#
#   gh workflow run render.yml -f slug=fly -f comp_id=Fly -f total_frames=43380 -f chunks=24
#   (re-render parcial: agregar -f only_chunks=3  o  -f only_chunks=3,4  o  -f only_chunks=3-5)
name: render

on:
  workflow_dispatch:
    inputs:
      slug:        { description: "slug del video", required: true }
      comp_id:     { description: "id de composicion Remotion", required: true }
      total_frames: { description: "frames totales", required: true }
      chunks:      { description: "en cuantos pedazos partir", required: false, default: "24" }
      only_chunks: { description: "solo estos chunks (ej 3 | 3,4 | 3-5). vacio = todos", required: false, default: "" }
      entry:       { description: "entry propio del video (ej src/index_<slug>.tsx). vacio = Root.tsx compartido", required: false, default: "" }

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          N=${{ github.event.inputs.chunks }}; ONLY="${{ github.event.inputs.only_chunks }}"
          if [ -n "$ONLY" ]; then
            LIST=$(node -e "const s=process.argv[1];const o=[];for(const p of s.split(',')){if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=b;i++)o.push(i)}else o.push(+p)}console.log(JSON.stringify([...new Set(o)]))" "$ONLY")
          else
            LIST=$(node -e "console.log(JSON.stringify(Array.from({length:$N},(_,i)=>i)))")
          fi
          echo "matrix=$LIST" >> "$GITHUB_OUTPUT"
      - name: reset progreso (Bagasy)
        if: ${{ github.event.inputs.only_chunks == '' }}
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SB_URL }}/rest/v1/rpc/render_reset" -H "apikey: ${{ secrets.SB_ANON }}" -H "Authorization: Bearer ${{ secrets.SB_ANON }}" -H "Content-Type: application/json" -d '{"p_slug":"${{ github.event.inputs.slug }}"}' || true

  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - name: cache node_modules + chromium
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: rmn-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: rmn-${{ runner.os }}-
      - name: install deps (si no vinieron del cache)
        run: |
          if [ -d node_modules ] && node -e "require('@rspack/binding')" 2>/dev/null; then
            echo "deps cacheadas ✓ — salteo npm ci"
          else
            n=0
            until npm ci; do n=$((n+1)); [ "$n" -ge 4 ] && { echo "npm ci fallo tras $n"; exit 1; }; echo "npm ci reintento $n"; rm -rf node_modules; sleep 20; done
            if ! node -e "require('@rspack/binding')" 2>/dev/null; then
              RV=$(node -p "require('@rspack/binding/package.json').version" 2>/dev/null || echo "")
              echo "rspack binding ausente — instalando linux-x64-gnu@${RV}"
              npm i -D "@rspack/binding-linux-x64-gnu@${RV}" --no-save --force || true
            fi
          fi
      - name: download assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # 20-24 runners bajan el MISMO tar a la vez; sin reintento, uno que rebota mata la corrida
          # ENTERA después de que los demás chunks ya pagaron minutos de render. Mismo criterio que npm ci.
          n=0
          until gh release download "assets-${{ github.event.inputs.slug }}" -R "${{ github.repository }}" \
                  --pattern "assets-${{ github.event.inputs.slug }}.tar" --dir . --clobber; do
            n=$((n+1)); [ "$n" -ge 4 ] && { echo "no pude bajar los assets tras $n intentos"; exit 1; }
            echo "reintento $n de la descarga de assets"; sleep $((10 * n))
          done
          mkdir -p public
          tar -xf "assets-${{ github.event.inputs.slug }}.tar" -C public
      - name: frame range
        id: r
        run: node scripts/chunkmath.mjs ${{ github.event.inputs.total_frames }} ${{ github.event.inputs.chunks }} ${{ matrix.idx }} >> "$GITHUB_OUTPUT"
      - name: render chunk
        run: |
          mkdir -p out
          # con entry propio por video, dos renders en paralelo no comparten Root.tsx y no se pisan.
          # OJO: el entry-point de `remotion render` es un ARGUMENTO POSICIONAL (va ANTES del
          # comp-id), no un flag --entry=... (ese flag no existe y se ignora en silencio, cayendo
          # al entry por defecto src/index.ts — compartido y pisado por otros agentes).
          ENTRY="${{ github.event.inputs.entry }}"
          if [ -n "$ENTRY" ]; then
            TMPDIR=/dev/shm npx remotion render "$ENTRY" "${{ github.event.inputs.comp_id }}" \
              "out/chunk_${{ matrix.idx }}.mp4" \
              --frames=${{ steps.r.outputs.start }}-${{ steps.r.outputs.end }} \
              --concurrency=4 --timeout=120000 --crf=23
          else
            TMPDIR=/dev/shm npx remotion render "${{ github.event.inputs.comp_id }}" \
              "out/chunk_${{ matrix.idx }}.mp4" \
              --frames=${{ steps.r.outputs.start }}-${{ steps.r.outputs.end }} \
              --concurrency=4 --timeout=120000 --crf=23
          fi
      - name: reportar progreso del chunk (Bagasy)
        continue-on-error: true
        run: |
          DELTA=$(node -e "console.log(95/${{ github.event.inputs.chunks }})")
          curl -s -X POST "${{ secrets.SB_URL }}/rest/v1/rpc/render_bump" -H "apikey: ${{ secrets.SB_ANON }}" -H "Authorization: Bearer ${{ secrets.SB_ANON }}" -H "Content-Type: application/json" -d "{\"p_slug\":\"${{ github.event.inputs.slug }}\",\"p_delta\":$DELTA}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: out/chunk_${{ matrix.idx }}.mp4
          retention-days: 3

  stitch:
    needs: render
    runs-on: ubuntu-latest
    # contents:write es OBLIGATORIO: los permisos por defecto del repo son READ, así que sin esto el
    # release chunks-<slug> NO se puede crear. Era la causa de que la persistencia de chunks nunca
    # funcionara (0 releases chunks-* en 156) y de que TODO re-render parcial saliera truncado.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: chunks, pattern: "chunk-*", merge-multiple: true }
      - name: traer chunks persistidos (reusar los no-cambiados)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # -R explícito: este job NO hace checkout, así que gh no puede inferir el repo del .git
          gh release download "chunks-${{ github.event.inputs.slug }}" -R "${{ github.repository }}" --dir prev --pattern "*.mp4" || true
          if [ -d prev ]; then cp -n prev/*.mp4 chunks/ 2>/dev/null || true; fi
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: concat (todos los N en orden)
        run: |
          ls chunks
          for i in $(seq 0 $(( ${{ github.event.inputs.chunks }} - 1 ))); do
            echo "file '$PWD/chunks/chunk_$i.mp4'" >> list.txt
          done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy "${{ github.event.inputs.slug }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ github.event.inputs.slug }}
          path: ${{ github.event.inputs.slug }}.mp4
          retention-days: 7
      # ── CHEQUEO TECNICO EN LA NUBE (etapa 2 del auditor) ────────────────────────────────────
      # ffmpeg ya esta instalado acá. Haciendolo aca el agente NO necesita bajarse 700 MB para
      # verificar duracion/audio/negros: lee esta salida del log de la corrida.
      - name: chequeo tecnico del MP4
        continue-on-error: true
        run: |
          F="${{ github.event.inputs.slug }}.mp4"
          echo "=== CHEQUEO_TECNICO ==="
          echo "bytes: $(stat -c%s "$F")"
          echo "duracion_s: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          echo "streams: $(ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$F" | tr '\n' ' ')"
          echo "audio_ok: $(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$F" | head -1)"
          # negros de mas de 2s (un fundido normal no llega)
          echo "--- negros >2s ---"
          ffmpeg -hide_banner -nostats -i "$F" -vf blackdetect=d=2:pic_th=0.98 -an -f null - 2>&1 | grep blackdetect || echo "ninguno"
          echo "=== FIN_CHEQUEO ==="
      # ── ENTREGA: publicar el MP4 como release ACA MISMO ────────────────────────────────────
      # El archivo ya esta armado y ya vive en GitHub. Antes se bajaba a la PC (~700 MB) para
      # volver a subirlo a otro release (~700 MB): ida y vuelta por la conexion del creador para
      # mover un archivo de GitHub a GitHub. Peor: lo que se publicaba salia del disco local, y
      # por eso una vez se entrego un render viejo (la parte 1 sola) en vez del final.
      # Publicando aca, lo entregado ES exactamente lo que se acaba de concatenar.
      - name: publicar el MP4 final como release
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          S="${{ github.event.inputs.slug }}"
          R="${{ github.repository }}"
          gh release create "$S" "$S.mp4" -R "$R" --title "$S" --notes "MP4 final — publicado por el farm" \
            || gh release upload "$S" "$S.mp4" -R "$R" --clobber
          echo "RELEASE_URL: https://github.com/$R/releases/download/$S/$S.mp4"
      - name: persistir chunks (para re-render parcial)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd chunks
          R="${{ github.repository }}"   # sin -R falla: el job stitch no hace checkout
          gh release delete "chunks-${{ github.event.inputs.slug }}" -R "$R" --yes --cleanup-tag 2>/dev/null || true
          gh release create "chunks-${{ github.event.inputs.slug }}" chunk_*.mp4 -R "$R" --title "chunks-${{ github.event.inputs.slug }}" --notes "chunks para re-render parcial" \
            || gh release upload "chunks-${{ github.event.inputs.slug }}" chunk_*.mp4 -R "$R" --clobber
      - name: progreso 100 (Bagasy)
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.SB_URL }}/rest/v1/rpc/render_bump" -H "apikey: ${{ secrets.SB_ANON }}" -H "Authorization: Bearer ${{ secrets.SB_ANON }}" -H "Content-Type: application/json" -d '{"p_slug":"${{ github.event.inputs.slug }}","p_delta":100}' || true
