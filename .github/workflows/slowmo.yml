# CÁMARA LENTA de los clips multishot de agnes, en el farm (15-oct-2026).
# Por qué: minterpolate mci (0,33×) cuesta ~34 s de CPU por toma en la laptop; con 40-60 tomas por video y varios
# videos a la par la laptop quedaba al 100 % y frenaba todo. Acá cada runner baja el crudo de agnes (URL pública),
# corta sus tomas con EL MISMO filtro y calidad que scripts/agnes_multishot.mjs, y las sube al release slowmo-<slug>.
# Lo dispara agnes_multishot.mjs (SLOWMO_FARM, por defecto sí); si esto falla, el script corta en local como siempre.
name: slowmo
run-name: slowmo ${{ fromJSON(inputs.job).id }}

on:
  workflow_dispatch:
    inputs:
      job: { description: 'JSON {id, slug, url, slow, cuts:[{n,s,len}]}', required: true }

permissions:
  contents: write

jobs:
  slowmo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      JOB: ${{ inputs.job }}
    steps:
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: cortar en paralelo
        run: |
          set -e
          echo "$JOB" > job.json
          ID=$(jq -r .id job.json); SLUG=$(jq -r .slug job.json); SLOW=$(jq -r .slow job.json)
          # 20-oct: bash no hace cuentas con decimales ($((30*3.6)) = syntax error) → el fps se calcula con awk
          FPS=$(awk -v s="$SLOW" 'BEGIN{printf "%g", 30*s}')
          for n in 1 2 3 4 5; do curl -fsSL --max-time 300 "$(jq -r .url job.json)" -o raw.mp4 && [ -s raw.mp4 ] && break; sleep $((n*5)); done
          mkdir out
          jq -c '.cuts[]' job.json | while read -r c; do
            echo "$(jq -r .n <<<"$c") $(jq -r .s <<<"$c") $(jq -r .len <<<"$c")"
          done > cuts.txt
          # MISMO filtro que cortarToma() de agnes_multishot.mjs (cambiarlo en los dos lados)
          cat cuts.txt | xargs -P "$(nproc)" -L 1 bash -c 'ffmpeg -v error -y -ss "$1" -t "$2" -i raw.mp4 -vf "minterpolate=fps='"$FPS"':mi_mode=mci:mc_mode=aobmc:vsbmc=1,setpts='"$SLOW"'*PTS,fps=30,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,setsar=1" -an -r 30 -c:v libx264 -crf 19 -preset veryfast -pix_fmt yuv420p "out/'"$ID"'__$0.mp4"'
          ls -la out
          R="slowmo-$SLUG"
          gh release view "$R" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$R" -R "$GITHUB_REPOSITORY" --title "$R" --notes "clips en cámara lenta (temporales)" || true
          for n in 1 2 3 4; do gh release upload "$R" out/*.mp4 -R "$GITHUB_REPOSITORY" --clobber && break; sleep $((n*8)); done
