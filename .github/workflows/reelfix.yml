name: reelfix
on:
  push:
    branches: ['reelfix-*']
permissions:
  contents: write
jobs:
  uno:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        s: [rm8pa, rm8pb, rm8pc]
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          for n in 1 2 3 4; do curl -sfL --max-time 120 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break; sleep 10; done
          mkdir -p /tmp/ff && tar xf ff.tar.xz -C /tmp/ff --strip-components=1 && echo "/tmp/ff/bin" >> "$GITHUB_PATH" && rm ff.tar.xz
      - run: pip install -q opencv-python-headless numpy onnxruntime
      - name: modelo
        run: curl -sfL --retry 4 -o u2net_human_seg.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx
      - name: reel del tar
        run: |
          S=${{ matrix.s }}
          for n in 1 2 3 4 5; do gh release download "assets-$S" -R "$GITHUB_REPOSITORY" -p "assets-$S.tar" --clobber && break; sleep $((n*10)); done
          tar xf "assets-$S.tar" --wildcards --no-anchored "$S/reel0.mp4" --strip-components=0
          f=$(find . -name reel0.mp4 | head -1); test -s "$f"; mv "$f" reel0.mp4; rm -f "assets-$S.tar"
          ffprobe -v error -show_entries format=duration -of csv=p=0 reel0.mp4
      - name: arreglo
        run: python reelfix_farm.py ${{ matrix.s }}
      - name: subir
        run: |
          S=${{ matrix.s }}; R=reelfix-$S
          gh release view "$R" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$R" -R "$GITHUB_REPOSITORY" --title "$R" --notes "reel sin mosaico" --prerelease
          cp w/reel0_fixa.mp4 reel0_fix.mp4
          gh release upload "$R" -R "$GITHUB_REPOSITORY" --clobber reel0_fix.mp4 w/cmp_*.jpg
