# BIBLIOTECA DE ESTILOS (Bagasy → pestaña Biblioteca). Dos modos:
#
#  cortes: corta las muestras en loop de cada efecto (4-7 s, 854x480, sin audio) desde el MP4 final de
#          un video nuestro (release) o desde un video de YouTube (con proxy, nunca la IP de la casa),
#          arma el reel de cada estilo y sube todo al release `biblioteca`. La lista la sube
#          `D:/claude-brain/biblioteca/publicar.mjs` como `cortes.json` en ese mismo release.
#     gh workflow run biblioteca.yml -f modo=cortes [-f ids=ap6-roster,sl2-globo]
#
#  molde:  baja un video de YouTube que el creador quiere como estilo, saca hojas de contacto
#          (1 cuadro cada 2 s con el segundo impreso), la lista de cortes por cambio de escena,
#          el ritmo (cortes/min) y los subtítulos → release `molde-<slug>` para desglosarlo.
#     gh workflow run biblioteca.yml -f modo=molde -f url=https://youtu.be/XXXX -f slug=mimolde
name: biblioteca

on:
  workflow_dispatch:
    inputs:
      modo: { description: "cortes | molde", required: true, default: "cortes" }
      ids:  { description: "cortes: sólo estos ids (coma). vacío = todos los que falten en el release", required: false, default: "" }
      todo: { description: "cortes: 1 = rehacer aunque ya existan", required: false, default: "" }
      url:  { description: "molde: link de YouTube", required: false, default: "" }
      slug: { description: "molde: nombre corto", required: false, default: "" }

permissions:
  contents: write

jobs:
  biblioteca:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts/biblioteca", sparse-checkout-cone-mode: true }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: cache yt-dlp + ffmpeg
        uses: actions/cache@v4
        with: { path: ~/bincache, key: ytffmpeg-v2 }
      - name: install yt-dlp + ffmpeg
        # 20-oct: johnvansickle.com se colgó 5 min (curl exit 28) → ffmpeg estático de BtbN (release de GitHub,
        # rápido desde el runner) con tope de tiempo; si también falla, el ffmpeg de apt (sin cache).
        run: |
          mkdir -p ~/bincache
          curl -sfL --retry 3 --max-time 120 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/bincache/yt-dlp
          chmod a+rx ~/bincache/yt-dlp && sudo cp ~/bincache/yt-dlp /usr/local/bin/yt-dlp
          if [ ! -f ~/bincache/ffmpeg ]; then
            if curl -sfL --retry 2 --max-time 240 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz \
               && tar -xf /tmp/ff.tar.xz -C /tmp; then
              cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ~/bincache/ffmpeg; chmod a+rx ~/bincache/ffmpeg
            fi
          fi
          if [ -f ~/bincache/ffmpeg ]; then sudo cp ~/bincache/ffmpeg /usr/local/bin/ffmpeg
          else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; fi
          ffmpeg -version | head -1; yt-dlp --version
      - name: install deno (n-challenge de YouTube)
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL=$HOME/.deno sh >/dev/null
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: proxies (YouTube bloquea las IPs de GitHub)
        # 20-oct: varios devuelven 407 (credencial vencida) y quemaban los 6 intentos → quedan sólo los que hoy abren YouTube
        env: { YTPROXIES: "${{ secrets.YTPROXIES }}" }
        run: |
          printf '%s\n' "$YTPROXIES" | sed 's/\r$//' | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' > /tmp/todos.txt || true
          : > /tmp/proxies.txt
          while read -r p; do
            ( c=$(curl -s -o /dev/null -w '%{http_code}' -m 12 -x "$p" https://www.youtube.com/robots.txt || true)
              [ "$c" = "200" ] && echo "$p" >> /tmp/proxies.txt ) &
          done < /tmp/todos.txt; wait
          echo "proxies que andan: $(wc -l < /tmp/proxies.txt) de $(wc -l < /tmp/todos.txt)"
          true  # si ninguno anda queda vacío: los scripts prueban primero sin proxy (IP del runner)
      - name: cookies (YouTube pide "no soy un bot" a las IPs de GitHub; mismas cuentas que match.yml)
        env:
          C1: "${{ secrets.YTCOOKIES1 }}"
          C2: "${{ secrets.YTCOOKIES2 }}"
          C3: "${{ secrets.YTCOOKIES3 }}"
          C4: "${{ secrets.YTCOOKIES4 }}"
          C5: "${{ secrets.YTCOOKIES5 }}"
          C6: "${{ secrets.YTCOOKIES6 }}"
          C7: "${{ secrets.YTCOOKIES7 }}"
        run: |
          mkdir -p /tmp/cookies
          for i in 1 2 3 4 5 6 7; do v="C$i"; [ -n "${!v}" ] && printf '%s
' "${!v}" > /tmp/cookies/$i.txt; done
          echo "cookies: $(ls /tmp/cookies | wc -l)"
      - name: cortes
        if: ${{ github.event.inputs.modo == 'cortes' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          IDS: "${{ github.event.inputs.ids }}"
          TODO: "${{ github.event.inputs.todo }}"
        run: node scripts/biblioteca/cortar.mjs
      - name: molde
        if: ${{ github.event.inputs.modo == 'molde' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          URL: "${{ github.event.inputs.url }}"
          SLUG: "${{ github.event.inputs.slug }}"
        run: node scripts/biblioteca/molde.mjs
