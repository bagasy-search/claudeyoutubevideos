# RTX VSR encima de h3-comfy:refup (refvsr no entra en el runner) -> h3-comfy:refx (3-nov-2026)
name: h3rtx
permissions: { contents: read, packages: write }
on: { push: { branches: ["h3rtx-*"] } }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { variant: [ref] } }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: h3img }
      - name: liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: build y push
        run: |
          docker build -f h3img/Dockerfile.rtx --build-arg VARIANT=${{ matrix.variant }} --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t ghcr.io/bagasy-search/h3-comfy:${{ matrix.variant }}x .
          docker push ghcr.io/bagasy-search/h3-comfy:${{ matrix.variant }}x
