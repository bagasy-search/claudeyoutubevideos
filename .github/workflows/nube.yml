# Trabajo genérico en la nube (rama huérfana nube-<slug>-<tag>): baja insumos de un release, corre job.sh con
# ffmpeg/python/node, sube las salidas a un release y borra la rama. Lo arma push.sh. (11-nov, bernadette01)
# params.json: {"slug","in":"<release>","pats":["a.wav","b*.mp4"],"out":"<release>","outs":["x.wav","*.jpg"],"tarin":"opcional.tar"}
name: nube
on:
  push:
    branches: ['nube-*']
permissions:
  contents: write
  actions: read
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg estático + python
        timeout-minutes: 10
        run: |
          for n in 1 2 3; do curl -sfL --max-time 150 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && xz -t ff.tar.xz && break; rm -f ff.tar.xz; sleep $((n*5)); done
          if [ -s ff.tar.xz ]; then mkdir ffx && tar xf ff.tar.xz -C ffx --strip-components=1 && sudo cp ffx/bin/ffmpeg ffx/bin/ffprobe /usr/local/bin/; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
          pip install -q numpy scipy soundfile "opencv-python-headless==4.10.0.84" 2>&1 | tail -1
      - name: insumos
        run: |
          IN=$(python3 -c "import json;print(json.load(open('params.json')).get('in',''))")
          mkdir -p in
          if [ -n "$IN" ]; then
            for p in $(python3 -c "import json;print(' '.join(json.load(open('params.json')).get('pats',[])))"); do
              for n in 1 2 3 4 5; do gh release download "$IN" -R "$GITHUB_REPOSITORY" -p "$p" -D in --clobber && break; sleep $((n*6)); done
            done
          fi
          ls -la in | head -50; echo "insumos: $(ls in | wc -l)"
      - name: job.sh
        run: bash job.sh
      - name: subir salidas
        run: |
          OUT=$(python3 -c "import json;print(json.load(open('params.json'))['out'])")
          gh release view "$OUT" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$OUT" -R "$GITHUB_REPOSITORY" --title "$OUT" --notes "nube"
          F=""; for p in $(python3 -c "import json;print(' '.join(json.load(open('params.json'))['outs']))"); do for f in out/$p; do [ -s "$f" ] && F="$F $f"; done; done
          test -n "$F" || { echo "::error::sin salidas"; exit 1; }
          echo "subo:$F"
          for n in 1 2 3 4; do gh release upload "$OUT" $F -R "$GITHUB_REPOSITORY" --clobber && break; sleep $((n*20)); done
      - name: borrar la rama
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME" || true
