# Render del ESTUDIO en la nube (7/8-nov). Lo dispara D:/rtmp/dspanel/tools/nube.py desde render.py: nadie lo corre a mano.
# La PC arma el plan y sube a la release "est-<video>" UN paquete con las fotos/avatares que faltan, otro con voz+SFX
# y manifest_<plan>.json (cada segmento = su comando ffmpeg exacto). Acá:
#   render (matriz, 1 máquina por pedazo): renderiza sus segmentos + los une con los fundidos -> part_<k>_<hash>.mp4 (calidad final)
#   final: pega los pedazos SIN recomprimir + mezcla voz y SFX -> final_<plan>.mp4
name: estudio
run-name: estudio ${{ inputs.tag }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      tag:    { description: "release del video (est-<carpeta>)", required: true }
      plan:   { description: "hash del plan (manifest_<plan>.json)", required: true }
      chunks: { description: "pedazos a renderizar, JSON (ej [0,3,4]); [] = ninguno", required: true }
      final:  { description: "1 = armar final_<plan>.mp4", required: false, default: "1" }
      nonce:  { description: "id de la corrida (para encontrarla)", required: true }

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  FF_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
  T: ${{ inputs.tag }}
  R: ${{ github.repository }}
  P: ${{ inputs.plan }}

jobs:
  render:
    if: ${{ inputs.chunks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        k: ${{ fromJSON(inputs.chunks) }}
    steps:
      - name: ffmpeg
        run: |
          mkdir -p ~/ff
          if curl -fsSL --retry 3 "$FF_URL" | tar -xJ -C ~/ff --strip-components=1; then echo "$HOME/ff/bin" >> "$GITHUB_PATH"
          else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: pedazo ${{ matrix.k }}
        env:
          K: ${{ matrix.k }}
        run: |
          set -e
          mkdir -p w/in w/seg && cd w
          gh release download "$T" -R "$R" -p "manifest_$P.json" -O m.json
          python3 - <<'EOF'
          import json, sys, subprocess, os, concurrent.futures as cf
          E = os.environ; m = json.load(open("m.json")); K = E["K"]; c = m["chunks"][K]
          def bajar(pat, dst):
              for t in range(5):
                  if subprocess.run(["gh", "release", "download", E["T"], "-R", E["R"], "-p", pat, "-O", dst, "--clobber"]).returncode == 0: return
              sys.exit("no pude bajar " + pat)
          for pk in m.get("packs", []):
              bajar(pk, "pk.tar"); subprocess.run(["tar", "-xf", "pk.tar", "-C", "in"], check=True); os.remove("pk.tar")
          for n in sorted({x for s in c["segs"] for x in s["in"] if not os.path.exists("in/" + x)}): bajar(n, "in/" + n)
          def run1(s):
              r = subprocess.run(s["cmd"], capture_output=True, text=True); return s["i"], r.returncode, r.stderr[-400:]
          bad = 0
          with cf.ThreadPoolExecutor(4) as ex:
              for i, rc, err in ex.map(run1, c["segs"]):
                  if rc: bad += 1; print("seg", i, "ERR", err)
          if bad: sys.exit(1)
          # unir con los fundidos (igual que assemble.py), calidad final
          U = c["une"]; files = [s["cmd"][-1] for s in c["segs"]]; ns = list(U["ns"]); ds = U["ds"]
          ins, fc, prev, t = [], [], "[v0]", 0
          for k, f in enumerate(files):
              ins += ["-i", f]
              pre = ("trim=start_frame=%d,setpts=PTS-STARTPTS," % U["o"]) if (k == 0 and U["o"]) else ""
              fc.append("[%d:v]%ssettb=AVTB,fps=30,format=yuv420p,setsar=1[v%d]" % (k, pre, k))
          ns[0] -= U["o"]
          for k in range(1, len(files)):
              t += ns[k - 1]; d = ds[k - 1]; o = "[x%d]" % k
              fc.append(("%s[v%d]xfade=transition=fade:duration=%.4f:offset=%.4f%s" % (prev, k, d / 30, t / 30, o)) if d > 0 else ("%s[v%d]concat=n=2:v=1:a=0%s" % (prev, k, o)))
              prev = o
          out = "part_%s_%s.mp4" % (K, c["hash"])
          # 8-nov (enc v2): sale YA en formato de entrega para YouTube (lo que antes recomprimía la PC al entregar):
          # matriz bt709 rango tv, keyframe cada 2 s, tope 5 Mbps. Así el final no se toca más.
          fc.append("%sscale=out_color_matrix=bt709:out_range=limited,format=yuv420p[vout]" % (prev if len(files) > 1 else "[v0]"))
          r = subprocess.run(["ffmpeg", "-v", "error", "-y"] + ins + ["-filter_complex", ";".join(fc), "-map", "[vout]",
                              "-frames:v", str(U["frames"]), "-c:v", "libx264", "-crf", "20", "-preset", "medium", "-pix_fmt", "yuv420p", "-r", "30",
                              "-maxrate", "5M", "-bufsize", "10M", "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
                              "-color_range", "tv", "-colorspace", "bt709", "-color_primaries", "bt709", "-color_trc", "bt709",
                              "-video_track_timescale", "15360", "-an", out], capture_output=True, text=True)
          if r.returncode: print(r.stderr[-2000:]); sys.exit(1)
          n = int(subprocess.run(["ffprobe", "-v", "error", "-count_packets", "-select_streams", "v", "-show_entries", "stream=nb_read_packets", "-of", "csv=p=0", out], capture_output=True, text=True).stdout.strip())
          print("pedazo", K, "cuadros", n, "esperados", U["frames"])
          if n != U["frames"]: sys.exit("cuadros distintos a los esperados")
          EOF
          for t in 1 2 3 4 5; do gh release upload "$T" -R "$R" part_*.mp4 --clobber && break; sleep $((t*10)); done

  final:
    needs: render
    if: ${{ always() && inputs.final == '1' && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ffmpeg
        run: |
          mkdir -p ~/ff
          if curl -fsSL --retry 3 "$FF_URL" | tar -xJ -C ~/ff --strip-components=1; then echo "$HOME/ff/bin" >> "$GITHUB_PATH"
          else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: pegar + audio
        run: |
          set -e
          mkdir -p w/a && cd w
          gh release download "$T" -R "$R" -p "manifest_$P.json" -O m.json
          python3 - <<'EOF'
          import json, subprocess, sys, os
          E = os.environ; m = json.load(open("m.json")); P = E["P"]
          def bajar(pat, dst):
              for t in range(5):
                  if subprocess.run(["gh", "release", "download", E["T"], "-R", E["R"], "-p", pat, "-O", dst, "--clobber"]).returncode == 0: return
              sys.exit("no pude bajar " + pat)
          def run(cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode: print(" ".join(cmd)[:400]); print(r.stderr[-1500:]); sys.exit(1)
              return r
          ks = sorted(m["chunks"], key=int)
          with open("lista.txt", "w") as fh:
              for k in ks:
                  f = "part_%s_%s.mp4" % (k, m["chunks"][k]["hash"]); bajar(f, f); fh.write("file '%s'\n" % f)
          run(["ffmpeg", "-v", "error", "-y", "-f", "concat", "-safe", "0", "-i", "lista.txt", "-c", "copy", "-an", "video.mp4"])
          A = m.get("audio")
          if not A:      # sin voz (no debería pasar): final sin audio y qc vacío
              os.rename("video.mp4", "final_%s.mp4" % P); os.makedirs("qc", exist_ok=True)
              json.dump({"plan": P, "probe": {}, "negros": [], "voz": 0}, open("qc/final_info.json", "w"))
              subprocess.run(["tar", "-cf", "qc_%s.tar" % P, "qc"], check=True); sys.exit(0)
          for pk in m.get("apacks", []):
              bajar(pk, "ap.tar"); subprocess.run(["tar", "-xf", "ap.tar", "-C", "a"], check=True); os.remove("ap.tar")
          def dur(p): return float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", p], capture_output=True, text=True).stdout.strip())
          VOZ = "a/" + A["voz"]; C = A["cues"]
          ENT = ["-af", "pan=stereo|c0=c0|c1=c0", "-ar", "48000"]     # como la entrega de antes: estéreo parejo, 48 kHz
          if not C:
              run(["ffmpeg", "-v", "error", "-y", "-i", VOZ, "-ac", "2"] + ENT + ["-c:a", "aac", "-b:a", "192k", "mix.m4a"])
          else:
              inputs = ["-i", VOZ]; parts = []
              for i, (f, t, g, fo) in enumerate(C, start=1):
                  inputs += ["-i", "a/" + f]; d = min(dur("a/" + f), 20.0)
                  parts.append("[%d:a]volume=%.4f,atrim=0:%.2f,afade=t=out:st=%.2f:d=%.2f,adelay=%d|%d[a%d]" % (i, g, d, max(0.0, d - fo), fo, t, t, i))
              mix = "".join("[a%d]" % i for i in range(1, len(C) + 1))
              fc = ";".join(parts) + ";[0:a]" + mix + ("amix=inputs=%d:normalize=0:duration=first,pan=stereo|c0=c0|c1=c0[out]" % (len(C) + 1))
              run(["ffmpeg", "-v", "error", "-y"] + inputs + ["-filter_complex", fc, "-map", "[out]", "-ac", "2", "-ar", "48000", "-c:a", "aac", "-b:a", "192k", "mix.m4a"])
          FIN = "final_%s.mp4" % P
          run(["ffmpeg", "-v", "error", "-y", "-i", "video.mp4", "-i", "mix.m4a", "-map", "0:v", "-map", "1:a", "-c:v", "copy", "-c:a", "copy", "-movflags", "+faststart", FIN])
          print("final", dur(FIN), "s · video", dur("video.mp4"), "s · voz", dur(VOZ), "s")
          # 8-nov: el QC del final se hace ACÁ (la PC ya no baja el video): cuadros cada 30 s + datos + huecos negros
          os.makedirs("qc", exist_ok=True)
          run(["ffmpeg", "-v", "error", "-y", "-i", FIN, "-vf", "fps=1/30,scale=480:-2", "-q:v", "3", "qc/f_%03d.jpg"])
          pr = json.loads(run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height,r_frame_rate,channels,sample_rate:format=duration,size", "-of", "json", FIN]).stdout)
          bd = subprocess.run(["ffmpeg", "-v", "info", "-i", FIN, "-vf", "blackdetect=d=0.5:pix_th=0.10", "-an", "-f", "null", "-"], capture_output=True, text=True).stderr
          import re
          negros = [[float(a), float(b)] for a, b in re.findall(r"black_start:([\d.]+) black_end:([\d.]+)", bd)]
          json.dump({"plan": P, "probe": pr, "negros": negros, "voz": dur(VOZ)}, open("qc/final_info.json", "w"))
          subprocess.run(["tar", "-cf", "qc_%s.tar" % P, "qc"], check=True)
          print("qc:", len(os.listdir("qc")) - 1, "cuadros ·", len(negros), "huecos negros")
          EOF
          for t in 1 2 3 4 5; do gh release upload "$T" -R "$R" "final_$P.mp4" "qc_$P.tar" --clobber && break; sleep $((t*10)); done
