# Mide la regla Bertha (avatar cada <=20 s) sobre el MP4 final de cada slug del release <slug>. Rama medir-*.
name: ojo
on:
  push:
    branches: ['ojo-*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(cat slugs.json)" >> "$GITHUB_OUTPUT"
  uno:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        s: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "opencv-python-headless==4.10.0.84" "numpy<2" && (sudo timeout 420 apt-get -o DPkg::Lock::Timeout=120 install -y -qq ffmpeg >/dev/null || (sudo timeout 300 apt-get update -qq && sudo timeout 420 apt-get install -y -qq ffmpeg >/dev/null)) || true; ffmpeg -version | head -1
      - name: ojo
        run: |
          S=${{ matrix.s }}
          for n in 1 2 3 4 5; do gh release download "$S" -R "$GITHUB_REPOSITORY" -p "$S.mp4" --clobber && break; sleep $((n*10)); done
          test -s "$S.mp4"
          bash ojo.sh "$S"; cat ojo_${S}_lag.json
          grep -q lageos "ojo_${S}_lag.json"
      - uses: actions/upload-artifact@v4
        with: { name: "r_${{ matrix.s }}", path: "*_${{ matrix.s }}*", retention-days: 3 }
  juntar:
    needs: uno
    if: always()
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arts }
      - run: |
          cat arts/*/ojo_*_lag.json > lageos.jsonl; cp arts/*/ojo_*.jpg . ; ls
          T=$GITHUB_REF_NAME
          gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$T" -R "$GITHUB_REPOSITORY" --title "$T" --notes "OJO del director"
          gh release upload "$T" lageos.jsonl ojo_*.jpg -R "$GITHUB_REPOSITORY" --clobber
          git push "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" --delete "$GITHUB_REF_NAME" || true
