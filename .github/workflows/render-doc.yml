# Render distribuido del documental animado "El carruaje sin caballos" (motor canvas/WebGL en Chromium, NO Remotion).
# El HTML de cada conjunto de escenas, render.cjs y la mezcla de audio se bajan de una URL pública (`base`).
# Cada job del matrix renderiza un rango de SEGUNDOS, lo codifica a un segmento mp4 (yuv420p, tv, bt709, GOP de 2 s)
# y el job stitch une los segmentos de cada conjunto, le pone el audio (mix_<S>.wav) y lo publica en el release `tag_out`.
#   gh workflow run render-doc.yml -f plan='[{"s":"A7","i":0,"a":0,"b":10}]' -f sets='["A7"]'
name: render-doc
on:
  push:
    branches: [ccr-ee37ab1c-ix86zj]
    paths: ['render-doc/job.json']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.j.outputs.plan }}
      sets: ${{ steps.j.outputs.sets }}
      final: ${{ steps.j.outputs.final }}
      base: ${{ steps.j.outputs.base }}
      slug: ${{ steps.j.outputs.slug }}
      tag_out: ${{ steps.j.outputs.tag_out }}
    steps:
      - uses: actions/checkout@v4
      - id: j
        run: |
          for k in plan sets final base slug tag_out; do
            echo "$k=$(node -e "const j=require('./render-doc/job.json');const v=j['$k'];console.log(typeof v==='string'?v:JSON.stringify(v??''))")" >> "$GITHUB_OUTPUT"
          done
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.plan) }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: cache playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-doc-${{ runner.os }}-v1
      - name: deps (playwright + chromium)
        run: |
          [ -d node_modules/playwright ] || npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: bajar html + render.cjs
        run: |
          curl -fsSL --retry 4 -o "${{ matrix.job.s }}.html" "${{ needs.prepare.outputs.base }}/${{ matrix.job.s }}.html"
          curl -fsSL --retry 4 -o render.cjs "${{ needs.prepare.outputs.base }}/render.cjs"
          ls -la
      - name: render ${{ matrix.job.s }} ${{ matrix.job.a }}-${{ matrix.job.b }} s
        run: |
          SCENE="$PWD/${{ matrix.job.s }}.html" RS=0.6667 FROM=${{ matrix.job.a }} TO=${{ matrix.job.b }} node render.cjs video frames 4 2>&1 | grep -v "ERR_FILE_NOT_FOUND" | tail -5
          ls frames | wc -l
      - name: codificar segmento
        run: |
          F0=$(ls frames | head -1 | sed 's/f_0*\([0-9]\)/\1/; s/\.jpg//')
          ffmpeg -v error -y -framerate 24 -start_number "$F0" -i frames/f_%05d.jpg \
            -vf "scale=1280:720:in_range=full:out_range=limited:out_color_matrix=bt709:flags=lanczos,format=yuv420p" \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:v libx264 -preset medium -crf 17 -g 48 -keyint_min 48 -sc_threshold 0 -x264-params open-gop=0 seg.mp4
          ls -la seg.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.job.s }}-${{ matrix.job.i }}
          path: seg.mp4
          retention-days: 2
  stitch:
    needs: [prepare, render]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJSON(needs.prepare.outputs.sets) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-${{ matrix.s }}-*
          path: segs
      - name: unir + audio
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsSL --retry 4 -o "mix_${{ matrix.s }}.wav" "${{ needs.prepare.outputs.base }}/mix_${{ matrix.s }}.wav"
          ls segs | sort -t- -k3 -n | while read d; do echo "file 'segs/$d/seg.mp4'"; done > lista.txt
          head -3 lista.txt
          ffmpeg -v error -y -f concat -safe 0 -i lista.txt -i "mix_${{ matrix.s }}.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -ar 48000 -af alimiter=limit=0.89 -shortest -movflags +faststart "${{ matrix.s }}.mp4"
          ls -la "${{ matrix.s }}.mp4"
          gh release view "${{ needs.prepare.outputs.tag_out }}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ needs.prepare.outputs.tag_out }}" -R "${{ github.repository }}" -t "${{ needs.prepare.outputs.tag_out }}" -n "salidas del render-doc"
          gh release upload "${{ needs.prepare.outputs.tag_out }}" "${{ matrix.s }}.mp4" -R "${{ github.repository }}" --clobber
  final:
    needs: [prepare, stitch]
    if: ${{ needs.prepare.outputs.final != '' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: concatenar conjuntos
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          : > lista.txt
          for s in $(echo '${{ needs.prepare.outputs.final }}' | tr -d '[]" ' | tr ',' ' '); do
            gh release download "${{ needs.prepare.outputs.tag_out }}" -R "${{ github.repository }}" -p "$s.mp4" -D sets
            echo "file 'sets/$s.mp4'" >> lista.txt
          done
          cat lista.txt
          ffmpeg -v error -y -f concat -safe 0 -i lista.txt -c copy -movflags +faststart "${{ needs.prepare.outputs.slug }}.mp4"
          ls -la "${{ needs.prepare.outputs.slug }}.mp4"
          gh release view "${{ needs.prepare.outputs.slug }}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ needs.prepare.outputs.slug }}" -R "${{ github.repository }}" -t "${{ needs.prepare.outputs.slug }}" -n "El carruaje sin caballos — documental animado"
          gh release upload "${{ needs.prepare.outputs.slug }}" "${{ needs.prepare.outputs.slug }}.mp4" -R "${{ github.repository }}" --clobber
